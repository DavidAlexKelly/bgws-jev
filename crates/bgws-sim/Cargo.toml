[package]
name = "bgws-sim"
description = "The World (ECS), the scheduler, every domain's systems, the sans-IO API."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
bgws-core.workspace = true
bgws-catalogue.workspace = true
bgws-env.workspace = true
bgws-prop.workspace = true
bgws-gpu.workspace = true
bgws-know.workspace = true
bgws-behaviour.workspace = true
bgws-scenario.workspace = true
bgws-models.workspace = true
bgws-domains.workspace = true
bgws-ops.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
bevy_ecs.workspace = true
rayon.workspace = true
rand.workspace = true
rand_chacha.workspace = true
rand_distr.workspace = true
nalgebra.workspace = true
# Profiling (§13): per-system spans for Tracy, off unless `--features profile`.
tracing = { version = "0.1.40", optional = true }
tracing-subscriber = { version = "0.3.18", optional = true, default-features = false, features = ["registry", "std"] }
tracing-tracy = { version = "0.11.1", optional = true }
ts-rs = { version = "9", optional = true, features = ["serde-json-impl"] }

[features]
profile = ["dep:tracing", "dep:tracing-subscriber", "dep:tracing-tracy"]
ts = ["dep:ts-rs", "bgws-core/ts"]

[dev-dependencies]
# The heuristic HQ planner, for tests that play as the host does.
bgws-decide.workspace = true
proptest.workspace = true
approx.workspace = true
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "tick"
harness = false
