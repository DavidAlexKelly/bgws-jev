# The simulation (the Rust workspace at the root): build, tests, lint, and the
# benchmark vignettes checked against their stored baselines (docs/design/RUST_ENGINE.md
# §15.8, §17); and the default frontend's committed build.
name: rust-engine

on:
  push:
    paths: ["crates/**", "apps/**", "data/**", "frontend/**", "protocol/**", "Cargo.toml", "Cargo.lock", ".github/workflows/rust-engine.yml"]
  pull_request:
    paths: ["crates/**", "apps/**", "data/**", "frontend/**", "protocol/**", "Cargo.toml", "Cargo.lock", ".github/workflows/rust-engine.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Lint
        run: cargo clippy --workspace --exclude bgws-desktop --all-targets -- -D warnings
      - name: The server builds without a bundled frontend (any frontend can replace it)
        run: cargo check -p bgws-server --no-default-features
      - name: Tests
        run: cargo test --workspace --exclude bgws-desktop
      - name: GPU kernels compile (twin tests skip without an adapter)
        run: cargo test -p bgws-gpu --features gpu

  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: WebKitGTK and a virtual display
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libxdo-dev xvfb
      - name: Lint
        run: cargo clippy -p bgws-desktop --all-targets -- -D warnings
      - name: The shell starts its host and loads the viewer
        run: |
          cargo build --release -p bgws-desktop
          xvfb-run -a target/release/bgws-desktop skirmish-advance-to-contact-v1 --deciders rules --smoke-s 2 2>&1 | tee desktop.log
          grep -q "bgws-desktop: loaded http://127.0.0.1" desktop.log

  viewer:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/viewer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/viewer/package-lock.json
      - name: Type-check and build the viewer
        run: |
          npm ci
          npm run build
      - name: The committed build is the current one (bgws-server embeds it)
        run: git diff --exit-code -- dist || (echo "frontend/viewer/dist is stale: run npm run build in frontend/viewer and commit it" && exit 1)

  duckdb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Event logs as DuckDB databases (builds DuckDB from C++)
        run: cargo test --release -p bgws-run --features duckdb --lib eventlog

  vignettes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Benchmark vignettes against their bands and baselines
        run: |
          cargo build --release -p bgws-run
          target/release/bgws vignettes -n 200 --store data/regression --backlog attack-halt
