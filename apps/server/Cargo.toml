[package]
name = "bgws-server"
description = "Hosts a game and speaks the BGWS protocol (WebSocket + HTTP, protocol/PROTOCOL.md) to any frontend; bundles the default viewer."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "bgws-server"
path = "src/main.rs"

[features]
default = ["bundled-viewer"]
# Embed the default frontend (frontend/viewer/dist). Without it, pass --web <dir>.
bundled-viewer = []

[dependencies]
bgws-core.workspace = true
bgws-sim.workspace = true
bgws-run.workspace = true
bgws-scenario.workspace = true
bgws-env.workspace = true
bgws-geodata.workspace = true
bgws-behaviour.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
clap.workspace = true
tokio = { workspace = true, features = ["net", "rt-multi-thread", "macros", "sync", "time", "fs"] }
axum = { version = "0.7", features = ["ws"] }
futures-util = "0.3"
