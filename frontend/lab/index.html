<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BGWS decision lab</title>
<style>
  :root {
    --bg: #0a111c; --panel: #111b2a; --line: #22324a; --text: #d8deea; --dim: #8592a8; --accent: #f2c14e;
    --blue: #6fb6ff; --red: #ff7a6b; --good: #6fd08c; --bad: #ff8a7a;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); }
  header { display: flex; align-items: center; gap: 16px; padding: 10px 16px; border-bottom: 1px solid var(--line); }
  header b { color: var(--accent); letter-spacing: .08em; }
  header a { color: var(--dim); }
  .tabs button, button { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 4px; padding: 5px 10px; font: inherit; cursor: pointer; }
  .tabs button.on { border-color: var(--accent); color: var(--accent); }
  button.go { border-color: var(--accent); color: var(--accent); }
  button:disabled { opacity: .5; cursor: wait; }
  main { display: grid; grid-template-columns: 340px 1fr; height: calc(100vh - 47px); }
  main.wide { grid-template-columns: 1fr; }
  #list { border-right: 1px solid var(--line); overflow: auto; }
  #filters { padding: 8px; display: flex; flex-wrap: wrap; gap: 6px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--bg); }
  select, input, textarea { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 4px; padding: 4px 6px; font: inherit; }
  .item { padding: 7px 10px; border-bottom: 1px solid #16233a; cursor: pointer; }
  .item:hover { background: #13213a; }
  .item.on { background: #1a2a45; }
  .item .sub { color: var(--dim); font-size: 11px; margin-top: 2px; }
  .tag { display: inline-block; font-size: 10px; padding: 0 5px; border-radius: 3px; border: 1px solid var(--line); color: var(--dim); margin-left: 4px; }
  .tag.y { color: var(--accent); border-color: #6a5622; }
  .tag.g { color: var(--good); border-color: #2c5a3a; }
  .tag.r { color: var(--bad); border-color: #6a2e28; }
  #detail { overflow: auto; padding: 14px 18px; }
  h2 { margin: 0 0 4px; font-size: 16px; }
  h3 { margin: 18px 0 6px; font-size: 12px; color: var(--dim); text-transform: uppercase; letter-spacing: .1em; }
  .dim { color: var(--dim); }
  .blue { color: var(--blue); } .red { color: var(--red); }
  .grid2 { display: grid; grid-template-columns: 330px 1fr; gap: 18px; align-items: start; }
  table { border-collapse: collapse; width: 100%; }
  th, td { text-align: left; padding: 4px 6px; border-bottom: 1px solid #1a2840; vertical-align: top; }
  th { color: var(--dim); font-weight: normal; font-size: 11px; }
  td.num, th.num { text-align: right; white-space: nowrap; }
  #filters select { max-width: 100%; }
  .bar { position: relative; height: 12px; background: #16233a; border-radius: 2px; min-width: 140px; }
  .bar i { position: absolute; top: 0; bottom: 0; background: #4d7bd1; }
  .bar i.best { background: var(--good); }
  .bar s { position: absolute; top: -2px; bottom: -2px; border-left: 1px solid var(--text); border-right: 1px solid var(--text); opacity: .6; }
  .bar u { position: absolute; top: -3px; bottom: -3px; border-left: 1px dashed var(--dim); }
  .kv td:first-child { color: var(--dim); width: 150px; }
  .note { color: var(--dim); font-size: 12px; line-height: 1.5; max-width: 900px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 6px 0; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 12px 14px; margin-bottom: 14px; }
  #status { color: var(--accent); }
  svg text { font-family: inherit; }
</style>
</head>
<body>
<header>
  <b>BGWS</b><span>DECISION LAB</span>
  <span class="tabs"><button data-tab="cases">Cases</button> <button data-tab="suite">Suite</button> <button data-tab="moments" class="on">Moments</button> <button data-tab="report">Report</button> <button data-tab="work">Collect &amp; grade</button></span>
  <span id="status"></span>
  <span style="flex:1"></span>
  <a href="/">viewer</a><a href="/behaviour">behaviour</a>
</header>
<main id="main">
  <div id="list"><div id="filters"></div><div id="items"></div></div>
  <div id="detail"><p class="note">Pick a moment on the left. No moments yet? Use <b>Collect &amp; grade</b> to play some games, or <b>Add to lab</b> in the viewer to keep the game you are playing.</p></div>
</main>
<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const pct = (x) => (x == null ? "–" : `${Math.round(x * 100)}%`);
const clock = (s) => { s = Math.round(s); const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), x = s % 60; return `${h ? h + ":" : ""}${String(m).padStart(2, "0")}:${String(x).padStart(2, "0")}`; };
const status = (t) => { $("#status").textContent = t || ""; };
async function api(path, body) {
  const r = await fetch(path, body === undefined ? {} : { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) });
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}

let moments = [], current = null, tab = "moments";
const filt = { point: "", state: "", game: "", text: "" };

document.querySelectorAll(".tabs button").forEach((b) => (b.onclick = () => show(b.dataset.tab)));
function show(t) {
  tab = t;
  document.querySelectorAll(".tabs button").forEach((b) => b.classList.toggle("on", b.dataset.tab === t));
  $("#main").classList.toggle("wide", t !== "moments");
  $("#list").style.display = t === "moments" ? "" : "none";
  if (t === "moments") current ? openMoment(current.id) : ($("#detail").innerHTML = "");
  if (t === "report") report();
  if (t === "work") work();
  if (t === "cases") casesTab();
  if (t === "suite") suiteTab();
}

// ── The engagement suite ──────────────────────────────────────────────────

async function suiteTab() {
  $("#detail").innerHTML = `<p class="dim">loading…</p>`;
  const d = await api("/api/lab/suite");
  const s = (x) => (x ? `<span style="color:${x.mean > x.se ? "var(--good)" : x.mean < -x.se ? "var(--bad)" : "var(--text)"}">${x.mean >= 0 ? "+" : ""}${x.mean.toFixed(2)}</span> <span class="dim">±${x.se.toFixed(2)}</span>` : "–");
  const run = (r) => `
    <div class="card">
      <b>${esc(r.decider)}</b> <span class="dim">${r.pairs.length} paired games, seeds ${r.seeds.join(", ")} · ${r.wallS.toFixed(0)} s · $${r.costUsd.toFixed(4)}${r.answeredShare != null ? ` · ${pct(r.answeredShare)} of its questions answered by it` : ""}</span>
      <table style="margin-top:8px">
        <tr><th>scenario</th><th class="num">pairs</th><th class="num">better / worse</th><th class="num">result Δ</th><th class="num">exchange Δ</th><th class="num">own loss Δ</th><th class="num">enemy loss Δ</th><th class="num">survival Δ</th></tr>
        ${r.summaries.map((m) => `<tr style="${m.scope === "all" ? "font-weight:bold" : ""}"><td>${esc(m.scope)}</td><td class="num">${m.pairs}</td><td class="num">${m.better} / ${m.worse}</td><td class="num">${s(m.result)}</td><td class="num">${s(m.exchange)}</td><td class="num">${s({ mean: -m.ownLoss.mean, se: m.ownLoss.se }).replace(/^/, "")}</td><td class="num">${s(m.enemyLoss)}</td><td class="num">${s(m.survival)}</td></tr>`).join("")}
      </table>
      ${r.kept && r.kept.length ? `<p class="note">Its worst games are in the Moments list (filter by game) to play out: ${r.kept.map(esc).join(", ")}</p>` : ""}
    </div>`;
  $("#detail").innerHTML = `
    <h2>Engagement suite</h2>
    <p class="note">Each scenario is played over several seeds with the decider answering one side's units and the rules the other's, and again with the rules on both sides on the same seed. The two games start the same and differ only by the decider's choices, so the difference (Δ) is what it adds, for the side it played: result (+1 a win, −1 a loss), exchange (enemy share lost − own share lost), losses, survival (the share of the game its vehicles lived). Green: better than the doctrine default by more than one standard error; red: worse. Own loss is shown so that up is good (fewer losses).</p>
    <div class="card"><div class="row">Play the suite with <select id="s-dec"><option>jev</option><option>claude</option><option>local</option><option>rules</option></select>
      model <input id="s-model" placeholder="as configured" size="20"> <label><input type="checkbox" id="s-prose"> also the words</label>
      seeds <input id="s-seeds" value="1,2,3,4" size="8"> keep the worst <input id="s-keep" type="number" value="4" style="width:50px"> games in the lab
      <label><input type="checkbox" id="s-all"> with the held-out scenarios</label>
      <button class="go" id="s-go">Play</button></div>
      <p class="note">Scenarios (data/suite/suite.json): ${d.entries.map((e) => `${esc(e.scenario)}${e.heldOut ? " (held out)" : ""}`).join(" · ")}</p></div>
    ${d.runs.map(run).join("") || `<p class="dim">No runs yet.</p>`}`;
  $("#s-go").onclick = async (e) => {
    e.target.disabled = true;
    status("playing the suite… (a minute or two)");
    try {
      const r = await api("/api/lab/suite", { deciders: $("#s-dec").value, model: $("#s-model").value || null, prose: $("#s-prose").checked, seeds: $("#s-seeds").value.split(",").map((x) => +x.trim()).filter((x) => !isNaN(x)), keepWorst: +$("#s-keep").value, all: $("#s-all").checked });
      status(`${r.decider}: result Δ ${r.summaries.at(-1).result.mean.toFixed(2)}`);
      await load();
      suiteTab();
    } catch (err) { status(err.message); e.target.disabled = false; }
  };
}

async function load() {
  moments = await api("/api/lab/moments");
  const points = [...new Set(moments.map((m) => m.trigger))].sort((a, b) => +a.slice(1) - +b.slice(1));
  const games = [...new Set(moments.map((m) => m.game))];
  $("#filters").innerHTML = `
    <select id="f-point"><option value="">every decision point</option>${points.map((p) => `<option ${filt.point === p ? "selected" : ""}>${p}</option>`).join("")}</select>
    <select id="f-state">
      ${[["", "all"], ["unplayed", "not played out"], ["decisive", "decisive"], ["unlabelled", "not labelled"], ["labelled", "labelled"], ["flagged", "flagged"]].map(([v, l]) => `<option value="${v}" ${filt.state === v ? "selected" : ""}>${l}</option>`).join("")}
    </select>
    <select id="f-game"><option value="">every game</option>${games.map((g) => `<option ${filt.game === g ? "selected" : ""}>${esc(g)}</option>`).join("")}</select>
    <input id="f-text" placeholder="unit…" value="${esc(filt.text)}" size="8">`;
  for (const k of ["point", "state", "game", "text"]) $(`#f-${k}`).oninput = (e) => { filt[k] = e.target.value; list(); };
  list();
}

function list() {
  const keep = (m) =>
    (!filt.point || m.trigger === filt.point) &&
    (!filt.game || m.game === filt.game) &&
    (!filt.text || m.agent.toLowerCase().includes(filt.text.toLowerCase())) &&
    ({ "": true, unplayed: !m.playedOut, decisive: m.decisive, unlabelled: !m.labelled, labelled: m.labelled, flagged: m.flagged })[filt.state];
  const v = moments.filter(keep);
  $("#items").innerHTML =
    `<div class="item dim">${v.length} of ${moments.length} moments</div>` +
    v.map((m) => `
      <div class="item ${current && current.id === m.id ? "on" : ""}" data-id="${esc(m.id)}">
        <span class="${m.side}">${esc(m.agent)}</span> · ${esc(m.trigger)} ${esc(m.title)}
        ${m.playedOut ? `<span class="tag ${m.decisive ? "g" : ""}">${m.decisive ? "decisive" : "played"}</span>` : ""}
        ${m.labelled ? `<span class="tag y">labelled</span>` : ""}${m.flagged ? `<span class="tag r">flag</span>` : ""}
        <div class="sub">${clock(m.atS)} · ${esc(m.game)} · ${m.options} options${m.graded.length ? " · graded: " + m.graded.map(esc).join(", ") : ""}</div>
      </div>`).join("");
  document.querySelectorAll(".item[data-id]").forEach((el) => (el.onclick = () => openMoment(el.dataset.id)));
}

// ── One moment ────────────────────────────────────────────────────────────

const BEARING = { north: 0, "north-east": 45, east: 90, "south-east": 135, south: 180, "south-west": 225, west: 270, "north-west": 315 };

function radar(st) {
  const W = 320, c = W / 2;
  const pts = [];
  for (const e of st.enemiesSeen || []) pts.push({ kind: "enemy", r: e.rangeM, b: BEARING[e.bearing], label: `${e.what} ${Math.round(e.rangeM)} m`, about: e.thisDecisionIsAboutIt });
  for (const f of st.friendsWithin3km || []) pts.push({ kind: "friend", r: f.rangeM, b: BEARING[f.bearing], label: f.unit });
  for (const k of (st.ground && st.ground.keyTerrainNear) || []) pts.push({ kind: "key", r: k.distanceM, b: BEARING[k.bearing], label: k.kind });
  const goal = st.orders && st.orders.headingFor;
  const reach = st.weaponReachM || 0;
  const far = Math.max(500, reach, goal ? goal.distanceM : 0, ...pts.map((p) => p.r));
  const scale = (c - 22) / Math.min(far, 6000);
  const at = (r, b) => [c + Math.sin((b * Math.PI) / 180) * Math.min(r, 6000) * scale, c - Math.cos((b * Math.PI) / 180) * Math.min(r, 6000) * scale];
  const step = [250, 500, 1000, 2000].find((s) => far / s <= 4) || 2000;
  let g = "";
  for (let r = step; r <= far; r += step) g += `<circle cx="${c}" cy="${c}" r="${r * scale}" fill="none" stroke="#1e2c44"/><text x="${c + 3}" y="${c - r * scale - 2}" fill="#56657d" font-size="9">${r >= 1000 ? r / 1000 + " km" : r + " m"}</text>`;
  if (reach) g += `<circle cx="${c}" cy="${c}" r="${Math.min(reach, 6000) * scale}" fill="none" stroke="#f2c14e" stroke-dasharray="4 4" opacity=".7"/>`;
  for (const u of st.firedOnByUnseen || []) { const [x, y] = at(far, BEARING[u.bearing]); g += `<line x1="${c}" y1="${c}" x2="${x}" y2="${y}" stroke="#ff7a6b" stroke-dasharray="2 4"/>`; }
  if (goal) { const [x, y] = at(goal.distanceM, BEARING[goal.bearing]); g += `<line x1="${c}" y1="${c}" x2="${x}" y2="${y}" stroke="#6fd08c" stroke-dasharray="6 3"/><text x="${x + 4}" y="${y}" fill="#6fd08c" font-size="10">objective</text>`; }
  for (const p of pts) {
    const [x, y] = at(p.r, p.b);
    if (p.kind === "enemy") g += `<path d="M${x} ${y - 7}L${x + 7} ${y}L${x} ${y + 7}L${x - 7} ${y}Z" fill="${p.about ? "#ff7a6b" : "#7a3a35"}" stroke="#ff7a6b"/><text x="${x + 9}" y="${y + 3}" fill="#ff9d91" font-size="10">${esc(p.label)}</text>`;
    else if (p.kind === "friend") g += `<rect x="${x - 5}" y="${y - 4}" width="10" height="8" fill="#2c4f7a" stroke="#6fb6ff"/><text x="${x + 8}" y="${y + 3}" fill="#8cc4ff" font-size="9">${esc(p.label)}</text>`;
    else g += `<path d="M${x} ${y - 6}L${x + 6} ${y + 5}L${x - 6} ${y + 5}Z" fill="none" stroke="#c9b26b"/><text x="${x + 8}" y="${y + 4}" fill="#c9b26b" font-size="9">${esc(p.label)}</text>`;
  }
  g += `<rect x="${c - 7}" y="${c - 5}" width="14" height="10" fill="#6fb6ff"/><text x="${c}" y="14" fill="#56657d" font-size="10" text-anchor="middle">N</text>`;
  return `<svg width="${W}" height="${W}" viewBox="0 0 ${W} ${W}" style="background:#0d1726;border:1px solid var(--line);border-radius:6px">${g}</svg>
    <div class="dim" style="font-size:11px;margin-top:4px">■ it · ◆ enemy seen (bright: this decision) · ▫ friends · △ key terrain · dashed yellow: its weapons' reach · dashed red: fire from unseen shooters · green: where its orders lead</div>`;
}

function kv(o) {
  return `<table class="kv">${Object.entries(o || {}).filter(([, v]) => v !== null && typeof v !== "object").map(([k, v]) => `<tr><td>${esc(k)}</td><td>${esc(v)}</td></tr>`).join("")}</table>`;
}
function rows(a, cols) {
  if (!a || !a.length) return `<div class="dim">none</div>`;
  cols = cols || Object.keys(a[0]);
  return `<table><tr>${cols.map((c) => `<th>${esc(c)}</th>`).join("")}</tr>${a.map((r) => `<tr>${cols.map((c) => `<td>${esc(typeof r[c] === "object" ? JSON.stringify(r[c]) : r[c])}</td>`).join("")}</tr>`).join("")}</table>`;
}

async function openMoment(id) {
  const m = await api(`/api/lab/moments/${encodeURIComponent(id)}`);
  current = m;
  list();
  const q = m.question, st = q.state || {}, p = m.playouts, label = m.label || {};
  const graded = Object.entries(m.graded || {});
  const vals = p ? p.options.flatMap((o) => [o.mean - o.se, o.mean + o.se]) : [0, 1];
  const lo = Math.min(0, ...vals), hi = Math.max(0.0001, ...vals);
  const x = (v) => ((v - lo) / (hi - lo)) * 100;
  const optRows = q.options.map((o) => {
    const r = p && p.options.find((r) => r.option === o.id);
    const marks = [
      o.id === q.fallback ? `<span class="tag">fallback</span>` : "",
      o.id === q.rules_choice ? `<span class="tag">rules</span>` : "",
      m.chosen && o.id === m.chosen.choice ? `<span class="tag y">as played</span>` : "",
      p && o.id === p.best ? `<span class="tag g">best</span>` : p && p.nearBest.includes(o.id) ? `<span class="tag g">near-best</span>` : "",
    ].join("");
    const bar = r ? `<div class="bar"><u style="left:${x(0)}%"></u><i class="${o.id === p.best ? "best" : ""}" style="left:${Math.min(x(0), x(r.mean))}%;width:${Math.abs(x(r.mean) - x(0))}%"></i><s style="left:${x(r.mean - r.se)}%;width:${x(r.mean + r.se) - x(r.mean - r.se)}%"></s></div>` : "";
    return `<tr>
      <td><input type="radio" name="best" value="${esc(o.id)}" ${label.best === o.id ? "checked" : ""} title="best"></td>
      <td><input type="checkbox" name="ok" value="${esc(o.id)}" ${(label.acceptable || []).includes(o.id) ? "checked" : ""} title="acceptable"></td>
      <td><b>${esc(o.id)}</b>${o.bias ? ` <span class="dim">bias ${o.bias > 0 ? "+" : ""}${o.bias}</span>` : ""}${marks}<div class="dim">${esc(o.summary)}</div></td>
      <td>${bar}${r ? `<div class="dim" style="font-size:11px">${r.mean >= 0 ? "+" : ""}${r.mean.toFixed(3)} ± ${r.se.toFixed(3)}</div>` : ""}</td>
      <td class="num">${r ? pct(r.enemyLoss) : ""}</td><td class="num">${r ? pct(r.sideLoss) : ""}</td><td class="num">${r ? pct(r.unitLoss) : ""}</td><td class="num">${r ? (r.progress * 100).toFixed(0) + "%" : ""}</td>
      ${graded.map(([, g]) => `<td class="num" style="${g.choice === o.id ? "color:var(--accent);font-weight:bold" : ""}">${g.probabilities && g.probabilities[o.id] != null ? pct(g.probabilities[o.id]) : g.choice === o.id ? "✓" : ""}</td>`).join("")}
    </tr>`;
  }).join("");
  $("#detail").innerHTML = `
    <h2><span class="${m.side}">${esc(m.agent)}</span> · ${esc(m.trigger)} ${esc(q.title)}</h2>
    <div class="dim">${clock(m.atS)} into ${esc(m.scenario)} · ${esc(m.game)}${m.chosen ? ` · in the game: <b>${esc(m.chosen.choice)}</b> (${esc(m.chosen.source)})` : ""}</div>
    <p>${esc(q.question)}</p>
    ${q.doctrine && q.doctrine.length ? `<p class="note">Doctrine: ${esc(q.doctrine.join(" "))}</p>` : ""}
    <div class="grid2">
      <div>${q.state ? radar(st) : `<div class="note">${esc(q.situation)}</div>`}</div>
      <div>
        <h3>The unit</h3>${kv(st.unit)}
        <h3>Orders</h3>${kv(st.orders)}
        <h3>Ground</h3>${kv(st.ground)}
      </div>
    </div>
    <h3>Its weapons</h3>${rows(st.weapons)}
    <h3>Enemy it has seen</h3>${rows(st.enemiesSeen, ["what", "identified", "rangeM", "bearing", "moving", "seenAgoS", "inOurReach", "itsReachM", "canReachUs", "thisDecisionIsAboutIt"])}
    <h3>The options</h3>
    <table>
      <tr><th>best</th><th>ok</th><th>option</th><th>play-out score (mean ± se)</th><th class="num">enemy lost</th><th class="num">side lost</th><th class="num">unit lost</th><th class="num">to objective</th>${graded.map(([k, g]) => `<th class="num" title="${esc(g.source)}">${esc(k)}${g.confidence != null ? ` (${pct(g.confidence)} sure)` : ""}</th>`).join("")}</tr>
      ${optRows}
    </table>
    <div class="row" style="margin-top:10px">
      <label><input type="checkbox" id="flag" ${label.flagged ? "checked" : ""}> flag this moment</label>
      <input id="note" placeholder="a note: why" size="50" value="${esc(label.note || "")}">
      <button class="go" id="save">Save my call</button>
      <button id="clear">Clear</button>
      <button id="mkcase" title="Keep it as a decision case: your best and acceptable options (else the play-outs' near-best) pass, options the play-outs found clearly worse fail">Make it a case</button>
    </div>
    <div class="card" style="margin-top:14px">
      <div class="row">
        <b>Play out</b><span class="dim">replay the game to this moment, force each option, play on with fresh dice, score from its side</span>
      </div>
      <div class="row">
        runs per option <input id="runs" type="number" value="${p ? p.runs : 12}" min="1" max="100" style="width:60px">
        minutes after <input id="horizon" type="number" value="${p ? p.horizonS / 60 : 20}" min="1" max="240" style="width:60px">
        <button class="go" id="play">${p ? "Play out again" : "Play out"}</button>
        ${p ? `<span class="dim">${p.runs} runs, ${p.horizonS / 60} min · ${p.decisive ? "decisive: some options clearly worse" : "not decisive: every option within the noise of the best"}</span>` : ""}
      </div>
      <p class="note">Score = enemy share lost − own side share lost − ½ × this unit's share lost + ¼ × share of the way to its objective made good, ±1 if the game is won or lost in the time. The thin bracket is the standard error; options within the noise of the best are near-best.</p>
    </div>
    <h3>What it was given</h3>
    <details><summary class="dim">the situation in words, and the state as sent</summary><p class="note">${esc(q.situation)}</p><pre class="note">${esc(JSON.stringify(st, null, 2))}</pre></details>`;
  $("#save").onclick = async () => {
    const best = $('input[name="best"]:checked');
    const ok = [...document.querySelectorAll('input[name="ok"]:checked')].map((e) => e.value);
    await api(`/api/lab/moments/${encodeURIComponent(m.id)}/label`, { best: best ? best.value : null, acceptable: ok, flagged: $("#flag").checked, note: $("#note").value });
    status("saved");
    await load();
  };
  $("#clear").onclick = async () => {
    await api(`/api/lab/moments/${encodeURIComponent(m.id)}/label`, { best: null, acceptable: [], flagged: false, note: "" });
    await load();
    openMoment(m.id);
  };
  $("#mkcase").onclick = async () => {
    try {
      const c = await api(`/api/lab/moments/${encodeURIComponent(m.id)}/case`, { why: $("#note").value });
      status(`case ${c.id}: acceptable ${c.acceptable.join(", ")}${c.wrong.length ? "; wrong " + c.wrong.join(", ") : ""}`);
    } catch (err) { status(err.message); }
  };
  $("#play").onclick = async (e) => {
    e.target.disabled = true;
    status("playing out… (each option, every run)");
    try {
      await api(`/api/lab/moments/${encodeURIComponent(m.id)}/playout`, { runs: +$("#runs").value, horizonMin: +$("#horizon").value });
      status("played out");
      await load();
      openMoment(m.id);
    } catch (err) { status(err.message); e.target.disabled = false; }
  };
}

// ── Report ────────────────────────────────────────────────────────────────

// ── Cases ─────────────────────────────────────────────────────────────────

async function casesTab() {
  $("#detail").innerHTML = `<p class="dim">building the cases…</p>`;
  const d = await api("/api/lab/cases");
  const runs = d.runs;
  const verdictOf = (run, caseId, variant = "base") => run.items.find((i) => i.case === caseId && i.variant === variant);
  const mark = (v) => (!v ? `<span class="dim">–</span>` : v.verdict === "pass" ? `<span style="color:var(--good)">✓ ${esc(v.choice)}</span>` : v.verdict === "wrong" ? `<span style="color:var(--bad)">✗ ${esc(v.choice)}</span>` : `<span class="dim">~ ${esc(v.choice)}</span>`);
  const n = (r) => r.pass + r.wrong + r.other;
  const points = [...new Set(runs.flatMap((r) => r.byPoint.map((p) => p.point)))].sort((a, b) => +a.slice(1) - +b.slice(1));
  const summary = runs.length
    ? `<table>
      <tr><th>decider</th><th class="num">questions</th><th class="num">pass</th><th class="num">wrong</th><th class="num">neither</th><th class="num">same when reordered / renamed</th><th class="num">trends</th><th class="num">sure when right</th><th class="num">sure when wrong</th><th class="num">cost</th></tr>
      ${runs.map((r) => `<tr><td>${esc(r.decider)}${r.fellBack && r.decider !== "template fallback" ? ` <span class="tag r" title="${esc((r.items.find((i) => i.source.startsWith("fallback")) || {}).source || "")}">${r.fellBack} fell back</span>` : ""}</td><td class="num">${n(r)}</td><td class="num">${pct(r.pass / n(r))}</td><td class="num">${pct(r.wrong / n(r))}</td><td class="num">${pct(r.other / n(r))}</td><td class="num">${r.invariant}/${r.invarianceChecks}</td><td class="num">${r.trends.filter((t) => t.pass).length}/${r.trends.length}</td><td class="num">${pct(r.meanConfidencePass)}</td><td class="num">${pct(r.meanConfidenceWrong)}</td><td class="num">$${r.costUsd.toFixed(4)}</td></tr>`).join("")}
    </table>
    <h3>Pass rate by decision point</h3>
    <table><tr><th>decider</th>${points.map((p) => `<th class="num">${p}</th>`).join("")}</tr>
      ${runs.map((r) => `<tr><td>${esc(r.decider)}</td>${points.map((p) => { const x = r.byPoint.find((y) => y.point === p); return `<td class="num">${x ? `${x.pass}/${x.items}` : "–"}</td>`; }).join("")}</tr>`).join("")}
    </table>`
    : `<p class="dim">No runs yet.</p>`;
  const rowsHtml = d.cases.map((x, k) => {
    const c = x.case;
    return `<tr class="case-row" data-k="${k}" style="cursor:pointer">
      <td><b>${esc(c.id)}</b>${c.source ? ` <span class="tag">from a moment</span>` : ""}${x.error ? `<div style="color:var(--bad)">${esc(x.error)}</div>` : ""}</td>
      <td>${esc(c.point)}</td><td>${esc(c.acceptable.join(", "))}</td><td>${esc((c.wrong || []).join(", "))}</td>
      ${runs.map((r) => `<td>${mark(verdictOf(r, c.id))}</td>`).join("")}
    </tr><tr id="cd-${k}" style="display:none"><td colspan="${4 + runs.length}"></td></tr>`;
  }).join("");
  $("#detail").innerHTML = `
    <h2>Decision cases</h2>
    <p class="note">Hand-written situations with the answers expected: the template's options for the decision point after its gates, the unit's state as the game would send it. A pass is a choice among the acceptable ones; wrong is one marked wrong; ~ is neither. Each case also asks with its options reversed and its unit renamed: the choice should not change. A trend asks the same case as one fact changes (an enemy closing) and checks the share on some options does not fall. Click a case for its picture, options and every question it asks.</p>
    <div class="card">
      <div class="row">Test <select id="t-dec"><option>jev</option><option>claude</option><option>local</option><option>rules</option></select>
        model <input id="t-model" placeholder="as configured" size="22">
        <label><input type="checkbox" id="t-prose"> also the words (Jev)</label>
        <button class="go" id="t-go">Run the cases</button>
        <span class="dim">${d.cases.length} cases. Jev needs OPENROUTER_API_KEY where the server runs; without it every answer is the fallback.</span></div>
    </div>
    ${summary}
    <h3>The cases</h3>
    <table>
      <tr><th>case</th><th>point</th><th>acceptable</th><th>wrong</th>${runs.map((r) => `<th>${esc(r.decider)}</th>`).join("")}</tr>
      ${rowsHtml}
    </table>`;
  document.querySelectorAll(".case-row").forEach((row) => (row.onclick = () => {
    const k = +row.dataset.k, x = d.cases[k], c = x.case, el = $(`#cd-${k}`);
    if (el.style.display !== "none") { el.style.display = "none"; return; }
    el.style.display = "";
    const variants = x.variants || ["base"];
    const optRows = (x.options || []).map((o) => `<tr><td><b>${esc(o.id)}</b>${c.acceptable.includes(o.id) ? ` <span class="tag g">acceptable</span>` : ""}${(c.wrong || []).includes(o.id) ? ` <span class="tag r">wrong</span>` : ""}<div class="dim">${esc(o.summary)}${o.bias ? ` (bias ${o.bias})` : ""}</div></td>
        <td>${o.id === x.fallback ? "✓" : ""}</td>
        ${runs.map((r) => { const v = verdictOf(r, c.id); const p = v && v.probabilities[o.id]; return `<td class="num" style="${v && v.choice === o.id ? "color:var(--accent);font-weight:bold" : ""}">${p != null ? pct(p) : v && v.choice === o.id ? "✓" : ""}</td>`; }).join("")}</tr>`).join("");
    const varRows = variants.map((v) => `<tr><td>${esc(v)}</td>${runs.map((r) => { const i = verdictOf(r, c.id, v); return `<td>${!i ? "–" : i.verdict === "same" ? `<span style="color:var(--good)">same (${esc(i.choice)})</span>` : i.verdict === "changed" ? `<span style="color:var(--bad)">changed to ${esc(i.choice)}</span>` : mark(i)}</td>`; }).join("")}</tr>`).join("");
    const trends = runs.flatMap((r) => r.trends.filter((t) => t.case === c.id).map((t) => `<p class="note">${esc(r.decider)}: trend "${esc(t.variation)}" toward ${esc(t.toward.join("/"))}: ${t.series.map((s) => pct(s)).join(" → ")} ${t.pass ? "✓" : "✗"}</p>`)).join("");
    el.firstElementChild.innerHTML = `
      <p class="note">${esc(c.why)}</p>
      <div class="grid2"><div>${x.state ? radar(x.state) : ""}</div><div>
        <h3>The options</h3>
        <table><tr><th>option</th><th>fallback</th>${runs.map((r) => `<th class="num">${esc(r.decider)}</th>`).join("")}</tr>${optRows}</table>
        <h3>Every question it asks</h3>
        <table><tr><th>variant</th>${runs.map((r) => `<th>${esc(r.decider)}</th>`).join("")}</tr>${varRows}</table>
        ${trends}
      </div></div>`;
  }));
  $("#t-go").onclick = async (e) => {
    e.target.disabled = true;
    status("asking every case…");
    try {
      const r = await api("/api/lab/test", { deciders: $("#t-dec").value, model: $("#t-model").value || null, prose: $("#t-prose").checked });
      status(`${r.decider}: ${r.pass} pass, ${r.wrong} wrong of ${n(r)}`);
      casesTab();
    } catch (err) { status(err.message); e.target.disabled = false; }
  };
}

async function report() {
  const r = await api("/api/lab/report");
  const all = r.rows.filter((x) => x.point === "all");
  const points = [...new Set(r.rows.map((x) => x.point).filter((p) => p !== "all"))].sort((a, b) => +a.slice(1) - +b.slice(1));
  const who = all.map((x) => x.decider);
  const cell = (d, p) => { const x = r.rows.find((y) => y.decider === d && y.point === p); return x && x.playedOut ? `${pct(x.nearBest)} <span class="dim">(${x.playedOut})</span>` : `<span class="dim">–</span>`; };
  $("#detail").innerHTML = `
    <h2>How the deciders do</h2>
    <p class="dim">${r.moments} moments · ${r.playedOut} played out (${r.decisive} decisive) · ${r.labelled} labelled · ${r.flagged} flagged</p>
    <table>
      <tr><th>decider</th>${["moments", "scored on", "near-best", "best", "regret", "labelled", "agrees with you", "confidence", "calibration error"].map((h) => `<th class="num">${h}</th>`).join("")}</tr>
      ${all.map((x) => `<tr><td>${esc(x.decider)}</td><td class="num">${x.moments}</td><td class="num">${x.playedOut}</td><td class="num">${pct(x.nearBest)}</td><td class="num">${pct(x.best)}</td><td class="num">${x.meanRegret == null ? "–" : x.meanRegret.toFixed(3)}</td><td class="num">${x.labelled}</td><td class="num">${pct(x.agreesWithLabels)}</td><td class="num">${pct(x.meanConfidence)}</td><td class="num">${x.calibrationError == null ? "–" : x.calibrationError.toFixed(2)}</td></tr>`).join("")}
    </table>
    <h3>Near-best by decision point <span class="dim">(decisive moments scored)</span></h3>
    <table><tr><th>decider</th>${points.map((p) => `<th class="num">${esc(p)}</th>`).join("")}</tr>
      ${who.map((d) => `<tr><td>${esc(d)}</td>${points.map((p) => `<td class="num">${cell(d, p)}</td>`).join("")}</tr>`).join("")}
    </table>
    <div class="note" style="margin-top:16px">
      <p><b>near-best</b>: of the decisive played-out moments (where some option is clearly worse than the best), how often its choice was within the noise of the best. <b>best</b>: how often it was the single best. <b>regret</b>: the score it gave up against the best, on average.</p>
      <p><b>agrees with you</b>: of the moments you labelled, how often its choice was your best or one you marked acceptable.</p>
      <p><b>confidence</b> and <b>calibration error</b>: for a decider that says how sure it is (Jev), its mean confidence, and how far that is from how often it was near-best (0 is honest; 0.2 means it is typically 20 points off).</p>
      <p>Yardsticks: <b>template fallback</b> is the doctrine default, <b>rules</b> the engine's own rule choice, <b>as played</b> what the game chose. A decider worth its cost should beat the fallback.</p>
    </div>`;
}

// ── Collect & grade ───────────────────────────────────────────────────────

function work() {
  $("#detail").innerHTML = `
    <div class="card">
      <b>Collect</b> <span class="dim">play a scenario and keep every unit decision</span>
      <div class="row">scenario <input id="c-sc" value="skirmish-advance-to-contact-v1" size="34"> seeds <input id="c-seeds" value="1,2,3" size="8"> minutes <input id="c-min" type="number" value="60" style="width:70px">
        deciders <select id="c-dec"><option>rules</option><option>jev</option><option>claude</option><option>scenario</option></select>
        <button class="go" id="c-go">Collect</button></div>
      <p class="note">Rules games are free and quick. A game played with Jev keeps Jev's choices as "as played". You can also keep the game you are playing in the viewer with <b>Add to lab</b>, or <code>bgws lab import game.json</code>.</p>
    </div>
    <div class="card">
      <b>Play out</b> <span class="dim">moments not played out yet</span>
      <div class="row">up to <input id="p-n" type="number" value="10" style="width:60px"> moments, decision point <input id="p-pt" placeholder="any" size="4">, runs <input id="p-runs" type="number" value="12" style="width:60px">, minutes after <input id="p-h" type="number" value="20" style="width:60px"> <button class="go" id="p-go">Play out</button></div>
      <p class="note">Each moment replays its game once per run per option, so a moment with 5 options at 12 runs is 60 short games. On a skirmish that is a few seconds a moment.</p>
    </div>
    <div class="card">
      <b>Grade</b> <span class="dim">ask a decider every moment's question afresh, as it was put</span>
      <div class="row">decider <select id="g-dec"><option>jev</option><option>claude</option><option>local</option><option>rules</option></select>
        model <input id="g-model" placeholder="as configured" size="22">
        <label><input type="checkbox" id="g-prose"> also the words (Jev)</label>
        <label><input type="checkbox" id="g-judged" checked> only played-out or labelled moments</label>
        <button class="go" id="g-go">Grade</button></div>
      <p class="note">Jev needs OPENROUTER_API_KEY in the server's environment (Claude ANTHROPIC_API_KEY); without one every answer is the fallback, and the report says so. Each setting is kept under its own name (the model, "+prose"), so two can be compared on the Report tab.</p>
    </div>`;
  const run = (btn, f) => async () => { btn.disabled = true; status("working…"); try { const r = await f(); status(JSON.stringify(r)); await load(); } catch (e) { status(e.message); } btn.disabled = false; };
  $("#c-go").onclick = run($("#c-go"), () => api("/api/lab/collect", { scenario: $("#c-sc").value, seeds: $("#c-seeds").value.split(",").map((s) => +s.trim()).filter((n) => !isNaN(n)), minutes: +$("#c-min").value, deciders: $("#c-dec").value }));
  $("#p-go").onclick = run($("#p-go"), () => api("/api/lab/playout", { limit: +$("#p-n").value, point: $("#p-pt").value || null, runs: +$("#p-runs").value, horizonMin: +$("#p-h").value }));
  $("#g-go").onclick = run($("#g-go"), () => api("/api/lab/grade", { deciders: $("#g-dec").value, model: $("#g-model").value || null, prose: $("#g-prose").checked, judgedOnly: $("#g-judged").checked }));
}

load().catch((e) => status(e.message));
</script>
</body>
</html>
