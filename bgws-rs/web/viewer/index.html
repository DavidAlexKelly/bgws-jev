<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BGWS viewer</title>
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/deck.gl@9.0.38/dist.min.js"></script>
<style>
  :root { --bg: #f6f6f3; --fg: #1d1d1b; --muted: #6b6b66; --panel: #ffffffee; --line: #d9d9d3; --blue: #2f6fd6; --red: #c8402f; }
  @media (prefers-color-scheme: dark) { :root { --bg: #151514; --fg: #ecece8; --muted: #9a9a94; --panel: #1f1f1dee; --line: #34342f; } }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 13px/1.4 system-ui, sans-serif; }
  #map { position: absolute; inset: 0; }
  .panel { position: absolute; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
  #controls { top: 12px; left: 12px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; max-width: calc(100% - 48px); }
  #controls button, #controls select { font: inherit; padding: 4px 10px; border-radius: 6px; border: 1px solid var(--line); background: transparent; color: var(--fg); cursor: pointer; }
  #clock { font-variant-numeric: tabular-nums; font-weight: 600; min-width: 90px; }
  #feed { right: 12px; top: 12px; width: min(380px, calc(100% - 48px)); max-height: 45vh; overflow: auto; }
  #feed div { border-bottom: 1px solid var(--line); padding: 3px 0; }
  #feed .t { color: var(--muted); font-variant-numeric: tabular-nums; margin-right: 6px; }
  #questions { left: 12px; bottom: 12px; width: min(420px, calc(100% - 48px)); max-height: 40vh; overflow: auto; display: none; }
  #questions button { margin: 2px 4px 2px 0; }
  #inspect { right: 12px; bottom: 12px; width: min(320px, calc(100% - 48px)); display: none; white-space: pre-wrap; }
  .muted { color: var(--muted); }
</style>
</head>
<body>
<div id="map"></div>
<canvas id="canvas" style="position:absolute;inset:0;width:100%;height:100%;display:none"></canvas>
<div id="controls" class="panel">
  <span id="clock">--:--:--</span>
  <button id="play">Play</button>
  <select id="speed"><option>1</option><option>2</option><option selected>10</option><option>60</option><option>600</option></select>
  <select id="viewer"><option value="umpire">Umpire (truth)</option><option value="blue">Blue view</option><option value="red">Red view</option></select>
  <span id="status" class="muted">connecting…</span>
</div>
<div id="feed" class="panel"></div>
<div id="questions" class="panel"></div>
<div id="inspect" class="panel"></div>
<script>
const SIDE = { blue: [47, 111, 214], red: [200, 64, 47], neutral: [120, 120, 110] };
let frame = null, playing = false, first = true;
// MapLibre + deck.gl when they load; a plain canvas when offline.
const online = typeof maplibregl !== "undefined" && typeof deck !== "undefined";
let map = null, overlay = null;
if (online) {
  map = new maplibregl.Map({
    container: "map",
    style: { version: 8, sources: { osm: { type: "raster", tiles: ["https://tile.openstreetmap.org/{z}/{x}/{y}.png"], tileSize: 256, attribution: "© OpenStreetMap contributors" } }, layers: [{ id: "osm", type: "raster", source: "osm" }] },
    center: [18.6, 54.2], zoom: 11,
  });
  overlay = new deck.MapboxOverlay({ interleaved: false, layers: [] });
  map.addControl(overlay);
} else {
  document.getElementById("canvas").style.display = "block";
}
const ws = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ws");
const send = (msg) => ws.readyState === 1 && ws.send(JSON.stringify(msg));
ws.onopen = () => { document.getElementById("status").textContent = "connected"; send({ kind: "viewer", viewer: document.getElementById("viewer").value }); };
ws.onclose = () => (document.getElementById("status").textContent = "disconnected");
ws.onmessage = (m) => {
  const msg = JSON.parse(m.data);
  if (msg.kind === "frame") render(msg.frame);
  else if (msg.kind === "events") feed(msg.events);
  else if (msg.kind === "questions") questions(msg.questions);
  else if (msg.kind === "status") document.getElementById("status").textContent = msg.text;
};
document.getElementById("play").onclick = () => { playing = !playing; document.getElementById("play").textContent = playing ? "Pause" : "Play"; send({ kind: playing ? "play" : "pause" }); };
document.getElementById("speed").onchange = (e) => send({ kind: "speed", speed: Number(e.target.value) });
document.getElementById("viewer").onchange = (e) => send({ kind: "viewer", viewer: e.target.value });

function ellipse(t) {
  const pts = [], mPerDegLat = 111320, mPerDegLon = 111320 * Math.cos(t.lat * Math.PI / 180);
  const a = t.angle_deg * Math.PI / 180;
  for (let i = 0; i <= 24; i++) {
    const th = (i / 24) * 2 * Math.PI, x = t.sx * Math.cos(th), y = t.sy * Math.sin(th);
    const e = x * Math.cos(a) + y * Math.sin(a), n = -x * Math.sin(a) + y * Math.cos(a);
    pts.push([t.lon + e / mPerDegLon, t.lat + n / mPerDegLat]);
  }
  return pts;
}
function render(f) {
  frame = f;
  document.getElementById("clock").textContent = f.clock;
  if (!online) return drawCanvas(f);
  if (first && f.entities.length) { first = false; const e = f.entities[0]; map.jumpTo({ center: [e.lon, e.lat], zoom: 12 }); }
  overlay.setProps({ layers: [
    new deck.PolygonLayer({ id: "tracks", data: f.tracks, getPolygon: ellipse, filled: true, stroked: true, getFillColor: (t) => [...SIDE[t.owner === "blue" ? "red" : "blue"], 30], getLineColor: (t) => [...SIDE[t.owner === "blue" ? "red" : "blue"], 160], lineWidthMinPixels: 1 }),
    new deck.ScatterplotLayer({ id: "entities", data: f.entities, pickable: true, getPosition: (e) => [e.lon, e.lat], getRadius: 6, radiusUnits: "pixels",
      getFillColor: (e) => e.status === "destroyed" ? [90, 90, 90, 120] : [...SIDE[e.side], e.status === "ok" ? 230 : 140],
      getLineColor: [255, 255, 255], lineWidthMinPixels: 1, stroked: true,
      onClick: (info) => inspect(info.object) }),
    new deck.TextLayer({ id: "labels", data: f.entities, getPosition: (e) => [e.lon, e.lat], getText: (e) => e.name, getSize: 11, getPixelOffset: [0, -14], getColor: (e) => [...SIDE[e.side], 255], fontFamily: "system-ui" }),
  ] });
}
let bounds = null, project = null;
function drawCanvas(f) {
  const c = document.getElementById("canvas"), dpr = window.devicePixelRatio || 1;
  c.width = c.clientWidth * dpr; c.height = c.clientHeight * dpr;
  const g = c.getContext("2d"); g.scale(dpr, dpr);
  const W = c.clientWidth, H = c.clientHeight;
  g.fillStyle = getComputedStyle(document.body).backgroundColor; g.fillRect(0, 0, W, H);
  if (!bounds && f.entities.length) {
    const lats = f.entities.map((e) => e.lat), lons = f.entities.map((e) => e.lon);
    const pad = 0.15;
    bounds = { s: Math.min(...lats), n: Math.max(...lats), w: Math.min(...lons), e: Math.max(...lons) };
    const dl = (bounds.n - bounds.s) * pad + 0.005, dw = (bounds.e - bounds.w) * pad + 0.005;
    bounds.s -= dl; bounds.n += dl; bounds.w -= dw; bounds.e += dw;
  }
  if (!bounds) return;
  // Local equirectangular projection, metres, fitted to the window.
  const c0 = Math.cos(((bounds.s + bounds.n) / 2) * Math.PI / 180);
  const mx = (lon) => (lon - bounds.w) * 111320 * c0, my = (lat) => (lat - bounds.s) * 111320;
  const k = Math.min(W / mx(bounds.e), H / my(bounds.n));
  const x = (lon) => mx(lon) * k, y = (lat) => H - my(lat) * k;
  project = { x, y };
  for (const t of f.tracks) {
    g.strokeStyle = `rgba(${SIDE[t.owner === "blue" ? "red" : "blue"].join(",")},0.6)`;
    g.beginPath(); ellipse(t).forEach(([lo, la], i) => (i ? g.lineTo(x(lo), y(la)) : g.moveTo(x(lo), y(la)))); g.stroke();
  }
  g.font = "11px system-ui";
  for (const e of f.entities) {
    const [r, gg, b] = SIDE[e.side];
    g.fillStyle = e.status === "destroyed" ? "rgba(90,90,90,0.6)" : `rgba(${r},${gg},${b},${e.status === "ok" ? 0.95 : 0.55})`;
    g.beginPath(); g.arc(x(e.lon), y(e.lat), 6, 0, 2 * Math.PI); g.fill();
    g.fillText(e.name, x(e.lon) + 8, y(e.lat) - 6);
  }
}
document.getElementById("canvas").onclick = (ev) => {
  if (!frame || !project) return;
  const d = (e) => Math.hypot(project.x(e.lon) - ev.offsetX, project.y(e.lat) - ev.offsetY);
  const near = [...frame.entities].sort((a, b) => d(a) - d(b))[0];
  inspect(near && d(near) < 20 ? near : null);
};
function feed(events) {
  const el = document.getElementById("feed");
  for (const ev of events) { const d = document.createElement("div"); d.innerHTML = `<span class="t">${ev.clock}</span>${escapeHtml(ev.text || ev.kind)}`; el.prepend(d); }
  while (el.childNodes.length > 200) el.removeChild(el.lastChild);
}
function questions(qs) {
  const el = document.getElementById("questions");
  el.style.display = qs.length ? "block" : "none";
  el.innerHTML = "";
  for (const q of qs) {
    const d = document.createElement("div");
    d.innerHTML = `<b>${escapeHtml(q.agent)}</b>: ${escapeHtml(q.title)}<div class="muted">${escapeHtml(q.question)}</div>`;
    for (const o of q.options) { const b = document.createElement("button"); b.textContent = o.summary || o.id; b.onclick = () => send({ kind: "answer", question: q.id, choice: o.id }); d.appendChild(b); }
    el.appendChild(d);
  }
}
function inspect(e) {
  const el = document.getElementById("inspect");
  if (!e) { el.style.display = "none"; return; }
  el.style.display = "block";
  el.textContent = JSON.stringify(e, null, 2);
}
function escapeHtml(s) { return String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]); }
</script>
</body>
</html>
