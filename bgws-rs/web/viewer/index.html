<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BGWS viewer</title>
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/deck.gl@9.0.38/dist.min.js"></script>
<style>
  :root { --bg: #f6f6f3; --fg: #1d1d1b; --muted: #6b6b66; --panel: #ffffffee; --line: #d9d9d3; --blue: #2f6fd6; --red: #c8402f; }
  @media (prefers-color-scheme: dark) { :root { --bg: #151514; --fg: #ecece8; --muted: #9a9a94; --panel: #1f1f1dee; --line: #34342f; } }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 13px/1.4 system-ui, sans-serif; }
  #map { position: absolute; inset: 0; }
  .panel { box-sizing: border-box; position: absolute; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
  #controls { top: 12px; left: 12px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; max-width: calc(100% - 48px); }
  #controls button, #controls select { font: inherit; padding: 4px 10px; border-radius: 6px; border: 1px solid var(--line); background: transparent; color: var(--fg); cursor: pointer; }
  #clock { font-variant-numeric: tabular-nums; font-weight: 600; min-width: 90px; }
  #clock.scrub { color: var(--blue); }
  #timeline { flex: 1 1 160px; min-width: 120px; }
  /* The controls stop short of the feed; on a narrow screen the feed drops below them. */
  @media (min-width: 900px) { #controls { max-width: calc(100% - 420px); } }
  @media (max-width: 899px) { #feed { top: 150px; max-height: 30vh; } }
  #feed { right: 12px; top: 12px; width: min(380px, calc(100% - 48px)); max-height: 45vh; overflow: auto; }
  #feed div { border-bottom: 1px solid var(--line); padding: 3px 0; }
  #feed .t { color: var(--muted); font-variant-numeric: tabular-nums; margin-right: 6px; }
  #questions { left: 12px; bottom: 12px; width: min(420px, calc(100% - 48px)); max-height: 40vh; overflow: auto; display: none; }
  #questions button { margin: 2px 4px 2px 0; }
  #inspect { right: 12px; bottom: 12px; width: min(320px, calc(100% - 48px)); display: none; white-space: pre-wrap; }
  .muted { color: var(--muted); }
  #layers { left: 12px; top: 110px; display: flex; flex-direction: column; gap: 2px; }
  #layers label { cursor: pointer; }
  #spectrum { left: 12px; right: 12px; bottom: 12px; height: 150px; display: none; padding: 6px 10px; }
  body.spec #inspect, body.spec #questions { bottom: 174px; }
  #spectrum svg { width: 100%; height: 120px; display: block; }
  #report { left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(720px, calc(100% - 32px)); max-height: 70vh; overflow: auto; display: none; }
  #report pre { white-space: pre-wrap; font: 12px/1.45 ui-monospace, monospace; margin: 8px 0 0; }
  #report .close, #inspect button { font: inherit; padding: 2px 10px; border-radius: 6px; border: 1px solid var(--line); background: transparent; color: var(--fg); cursor: pointer; }
  #hq { left: 12px; top: 200px; width: min(380px, calc(100% - 48px)); max-height: calc(55vh - 200px); min-height: 160px; overflow: auto; display: none; }
  #hq table { width: 100%; border-collapse: collapse; }
  #hq td { padding: 2px 4px 2px 0; border-bottom: 1px solid var(--line); }
  #hq select, #hq input, #hq button { font: inherit; padding: 2px 6px; border-radius: 6px; border: 1px solid var(--line); background: transparent; color: var(--fg); }
  #hq .row { display: flex; gap: 6px; align-items: center; margin: 4px 0; flex-wrap: wrap; }
  #report .close { float: right; }
</style>
</head>
<body>
<div id="map"></div>
<canvas id="canvas" style="position:absolute;inset:0;width:100%;height:100%;display:none"></canvas>
<div id="controls" class="panel">
  <span id="clock">--:--:--</span>
  <button id="play">Play</button>
  <select id="speed"><option>1</option><option>2</option><option selected>10</option><option>60</option><option>600</option></select>
  <select id="viewer"><option value="umpire">Umpire (truth)</option><option value="blue">Blue view</option><option value="red">Red view</option></select>
  <input id="timeline" type="range" min="0" max="0" step="1" value="0" title="Drag to look back through the game">
  <button id="live" title="Back to the live game">Live</button>
  <button id="branch" title="Restart the game from the moment shown and play on">Branch here</button>
  <button id="save" title="Write the game record on the server">Save</button>
  <button id="review" title="The after-action review so far">Review</button>
  <button id="hq-open" title="Give your side's orders as its HQ (pick Blue or Red view first)">HQ orders</button>
  <span id="status" class="muted">connecting…</span>
</div>
<div id="feed" class="panel"></div>
<div id="layers" class="panel">
  <label><input type="checkbox" id="lyr-sensors"> Sensor footprints</label>
  <label><input type="checkbox" id="lyr-spectrum"> Spectrum and jamming</label>
  <label><input type="checkbox" id="lyr-nets"> Nets</label>
  <label><input type="checkbox" id="lyr-chains" checked> Kill chains</label>
</div>
<div id="spectrum" class="panel"><span class="muted">On the air (log frequency; jammers as bands)</span><svg id="spectrum-svg"></svg></div>
<div id="hq" class="panel">
  <div class="row"><b id="hq-title">HQ orders</b><span class="muted" id="hq-note"></span></div>
  <div class="row">Seat <select id="hq-seat"><option value="planner">planner (model)</option><option value="person">person (me)</option><option value="rules">rules</option></select></div>
  <div class="row"><input id="hq-name" placeholder="Plan, in a few words" style="flex:1"></div>
  <div class="row"><button id="hq-pick">Pick objective on map</button><span id="hq-obj" class="muted">no objective</span></div>
  <div class="row">ROE <select id="hq-roe"><option value="always">fire at will</option><option value="withinShortRange" selected>within short range</option><option value="ifFiredUpon">if fired upon</option><option value="never">hold fire</option></select></div>
  <table id="hq-units"></table>
  <div class="row"><button id="hq-issue">Issue orders</button><button id="hq-close">Close</button></div>
</div>
<div id="report" class="panel"><button class="close" id="report-close">Close</button><b id="report-title"></b><pre id="report-text"></pre></div>
<div id="questions" class="panel"></div>
<div id="inspect" class="panel"></div>
<script>
const SIDE = { blue: [47, 111, 214], red: [200, 64, 47], neutral: [120, 120, 110] };
let frame = null, playing = false, first = true, shownT = 0, dragging = false;
// MapLibre + deck.gl when they load; a plain canvas when offline.
const online = typeof maplibregl !== "undefined" && typeof deck !== "undefined";
let map = null, overlay = null;
if (online) {
  map = new maplibregl.Map({
    container: "map",
    style: { version: 8, sources: { osm: { type: "raster", tiles: ["https://tile.openstreetmap.org/{z}/{x}/{y}.png"], tileSize: 256, attribution: "© OpenStreetMap contributors" } }, layers: [{ id: "osm", type: "raster", source: "osm" }] },
    center: [18.6, 54.2], zoom: 11,
  });
  overlay = new deck.MapboxOverlay({ interleaved: false, layers: [], getTooltip: ({ object, layer }) => (layer && layer.id === "chain-fire" && object ? `${object.kind}: ${object.stage}` : null) });
  map.addControl(overlay);
  map.on("click", (e) => picking && setObjective(e.lngLat.lng, e.lngLat.lat));
} else {
  document.getElementById("canvas").style.display = "block";
}
const ws = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ws");
const send = (msg) => ws.readyState === 1 && ws.send(JSON.stringify(msg));
ws.onopen = () => { document.getElementById("status").textContent = "connected"; send({ kind: "viewer", viewer: document.getElementById("viewer").value }); };
ws.onclose = () => (document.getElementById("status").textContent = "disconnected");
ws.onmessage = (m) => {
  const msg = JSON.parse(m.data);
  if (msg.kind === "frame") { timeline(msg); render(msg.frame); }
  else if (msg.kind === "branched") { document.getElementById("feed").innerHTML = ""; setPlaying(false); }
  else if (msg.kind === "events") feed(msg.events);
  else if (msg.kind === "questions") questions(msg.questions);
  else if (msg.kind === "status") document.getElementById("status").textContent = msg.text;
  else if (msg.kind === "report") showReport(msg.title, msg.text);
};
function setPlaying(p) { playing = p; document.getElementById("play").textContent = playing ? "Pause" : "Play"; }
document.getElementById("play").onclick = () => { setPlaying(!playing); send({ kind: playing ? "play" : "pause" }); };
// The timeline: drag to look back (keyframes), Live to return, Branch to play on from there.
const tl = document.getElementById("timeline");
tl.oninput = () => { dragging = true; setPlaying(false); send({ kind: "seek", t: Number(tl.value) }); };
tl.onchange = () => { dragging = false; };
document.getElementById("live").onclick = () => send({ kind: "live" });
document.getElementById("branch").onclick = () => {
  if (confirm(`Restart the game from ${document.getElementById("clock").textContent}? Everything after it is replaced.`)) send({ kind: "branch", t: shownT });
};
document.getElementById("save").onclick = () => send({ kind: "save" });
document.getElementById("review").onclick = () => send({ kind: "review" });
document.getElementById("report-close").onclick = () => (document.getElementById("report").style.display = "none");
function showReport(title, text) {
  document.getElementById("report-title").textContent = title;
  document.getElementById("report-text").textContent = text;
  document.getElementById("report").style.display = "block";
}
// ── HQ console: a person's orders for the side they view, sent over its nets ──
let picking = false, objective = null;
const hqSide = () => document.getElementById("viewer").value;
const TASKS = [["", "—"], ["advance", "advance to the objective"], ["assault", "assault the objective"], ["hold", "hold"], ["observe", "observe"], ["overwatch", "overwatch"], ["withdraw", "withdraw from the objective"]];
function hqUnits() {
  if (!frame) return [];
  return frame.entities.filter((e) => e.side === hqSide() && e.domain !== "drone" && e.status !== "destroyed");
}
function openHq() {
  const side = hqSide(), el = document.getElementById("hq");
  if (side === "umpire") { document.getElementById("status").textContent = "pick Blue or Red view to give that side's orders"; return; }
  document.getElementById("hq-title").textContent = `${side[0].toUpperCase() + side.slice(1)} HQ orders`;
  document.getElementById("hq-units").innerHTML = hqUnits().map((u) => `<tr><td>${escapeHtml(u.label || u.name)}</td><td><select data-unit="${escapeHtml(u.name)}">${TASKS.map(([v, t]) => `<option value="${v}">${t}</option>`).join("")}</select></td></tr>`).join("");
  el.style.display = "block";
}
document.getElementById("hq-open").onclick = openHq;
document.getElementById("hq-close").onclick = () => (document.getElementById("hq").style.display = "none");
document.getElementById("hq-seat").onchange = (e) => hqSide() !== "umpire" && send({ kind: "seat", side: hqSide(), seat: e.target.value });
document.getElementById("hq-pick").onclick = () => { picking = true; document.getElementById("hq-obj").textContent = "click the map…"; };
function setObjective(lon, lat) {
  picking = false;
  objective = { lat, lon };
  document.getElementById("hq-obj").textContent = `${lat.toFixed(4)}, ${lon.toFixed(4)}`;
}
// A point `m` metres from `from`, directly away from `away`.
function awayFrom(from, away, m) {
  const mLat = 111320, mLon = 111320 * Math.cos(from.lat * Math.PI / 180);
  const de = (from.lon - away.lon) * mLon, dn = (from.lat - away.lat) * mLat, d = Math.hypot(de, dn) || 1;
  return { lat: from.lat + (dn / d) * m / mLat, lon: from.lon + (de / d) * m / mLon };
}
document.getElementById("hq-issue").onclick = () => {
  const side = hqSide(), roe = document.getElementById("hq-roe").value;
  const byName = new Map(hqUnits().map((u) => [u.name, u]));
  const orders = [];
  for (const sel of document.querySelectorAll("#hq-units select")) {
    const task = sel.value, u = byName.get(sel.dataset.unit);
    if (!task || !u) continue;
    const needsObj = ["advance", "assault", "withdraw"].includes(task);
    if (needsObj && !objective) { document.getElementById("hq-note").textContent = "pick an objective first"; return; }
    const phases = {
      advance: [{ label: "advance", do: "move", to: objective, mode: "tactical" }, { label: "hold the objective", do: "overwatch" }],
      assault: [{ label: "assault", do: "move", to: objective, mode: "assault" }, { label: "hold the objective", do: "overwatch" }],
      withdraw: [{ label: "withdraw", do: "withdraw", to: needsObj ? awayFrom(u, objective, 1500) : null }, { label: "hold", do: "hold" }],
      hold: [{ label: "hold", do: "hold" }],
      observe: [{ label: "observe", do: "observe" }],
      overwatch: [{ label: "overwatch", do: "overwatch" }],
    }[task];
    orders.push({ unit: u.name, task, intent: document.getElementById("hq-name").value || task, roe, phases });
  }
  if (!orders.length) { document.getElementById("hq-note").textContent = "no unit has a task"; return; }
  send({ kind: "command", side, plan: { plan: document.getElementById("hq-name").value || `${side} HQ orders`, orders } });
  document.getElementById("hq-note").textContent = `${orders.length} orders sent over the nets`;
};
const layerOn = (k) => document.getElementById("lyr-" + k).checked;
for (const k of ["sensors", "spectrum", "nets", "chains"]) document.getElementById("lyr-" + k).onchange = () => frame && render(frame);
// A sensor's footprint: a circle, or a wedge for a sector, as lon/lat points.
function footprint(e, s) {
  const pts = [], mLat = 111320, mLon = 111320 * Math.cos(e.lat * Math.PI / 180);
  const all = s.for_deg >= 359, half = (s.for_deg / 2) * Math.PI / 180, h = s.heading_deg * Math.PI / 180;
  if (!all) pts.push([e.lon, e.lat]);
  for (let i = 0; i <= 32; i++) {
    const a = all ? (i / 32) * 2 * Math.PI : h - half + (i / 32) * 2 * half;
    pts.push([e.lon + (Math.sin(a) * s.range_m) / mLon, e.lat + (Math.cos(a) * s.range_m) / mLat]);
  }
  return pts;
}
function overlays(f) {
  const byId = new Map(f.entities.map((e) => [e.id, e]));
  const sensors = layerOn("sensors") ? f.sensors.filter((s) => byId.has(s.entity)).map((s) => ({ ...s, poly: footprint(byId.get(s.entity), s) })) : [];
  const jammers = layerOn("spectrum") ? f.emitters.filter((x) => x.kind === "jammer") : [];
  const emitters = layerOn("spectrum") ? f.emitters.filter((x) => x.kind !== "jammer") : [];
  const links = layerOn("nets") ? f.links.filter((l) => byId.has(l.from) && byId.has(l.to)).map((l) => ({ ...l, a: byId.get(l.from), b: byId.get(l.to) })) : [];
  const chains = layerOn("chains") ? (f.chains || []).filter((c) => byId.has(c.shooter)).map((c) => ({ ...c, s: c.sensor != null ? byId.get(c.sensor) : null, from: byId.get(c.shooter) })) : [];
  return { sensors, jammers, emitters, links, chains };
}
// The spectrum: emitters on a log-frequency axis, 1 MHz to 20 GHz; height by power.
function spectrum(f) {
  const panel = document.getElementById("spectrum");
  panel.style.display = layerOn("spectrum") ? "block" : "none";
  document.body.classList.toggle("spec", layerOn("spectrum"));
  if (!layerOn("spectrum")) return;
  const svg = document.getElementById("spectrum-svg"), W = svg.clientWidth || 600, H = 120;
  const x = (mhz) => ((Math.log10(Math.max(mhz, 1)) - 0) / Math.log10(20000)) * W;
  const y = (w) => H - 14 - Math.min(1, Math.max(0.08, (Math.log10(Math.max(w, 0.01)) + 2) / 6)) * (H - 20);
  let out = "";
  for (const mhz of [1, 10, 100, 1000, 10000]) out += `<line x1="${x(mhz)}" x2="${x(mhz)}" y1="0" y2="${H - 14}" stroke="currentColor" stroke-opacity="0.15"/><text x="${x(mhz) + 2}" y="${H - 2}" font-size="10" fill="currentColor" fill-opacity="0.6">${mhz >= 1000 ? mhz / 1000 + " GHz" : mhz + " MHz"}</text>`;
  for (const e of f.emitters) {
    const c = `rgb(${SIDE[e.side].join(",")})`;
    if (e.kind === "jammer") {
      const x0 = x(e.freq_mhz - e.bw_mhz / 2), x1 = x(e.freq_mhz + e.bw_mhz / 2);
      out += `<rect x="${x0}" y="${y(e.erp_w)}" width="${Math.max(2, x1 - x0)}" height="${H - 14 - y(e.erp_w)}" fill="${c}" fill-opacity="0.25" stroke="${c}"><title>jammer ${e.freq_mhz.toFixed(0)} MHz ±${(e.bw_mhz / 2).toFixed(0)}, ${e.erp_w.toFixed(0)} W</title></rect>`;
    } else {
      out += `<line x1="${x(e.freq_mhz)}" x2="${x(e.freq_mhz)}" y1="${y(e.erp_w)}" y2="${H - 14}" stroke="${c}" stroke-width="2"><title>${e.kind} ${e.freq_mhz.toFixed(1)} MHz, ${e.erp_w.toFixed(1)} W</title></line>`;
    }
  }
  svg.innerHTML = out;
}
function timeline(msg) {
  shownT = msg.t;
  tl.max = Math.max(1, Math.floor(msg.live));
  if (!dragging) tl.value = Math.floor(msg.t);
  document.getElementById("clock").classList.toggle("scrub", !!msg.scrub);
  document.getElementById("branch").disabled = !msg.scrub;
}
document.getElementById("speed").onchange = (e) => send({ kind: "speed", speed: Number(e.target.value) });
document.getElementById("viewer").onchange = (e) => send({ kind: "viewer", viewer: e.target.value });

function ellipse(t) {
  const pts = [], mPerDegLat = 111320, mPerDegLon = 111320 * Math.cos(t.lat * Math.PI / 180);
  const a = t.angle_deg * Math.PI / 180;
  for (let i = 0; i <= 24; i++) {
    const th = (i / 24) * 2 * Math.PI, x = t.sx * Math.cos(th), y = t.sy * Math.sin(th);
    const e = x * Math.cos(a) + y * Math.sin(a), n = -x * Math.sin(a) + y * Math.cos(a);
    pts.push([t.lon + e / mPerDegLon, t.lat + n / mPerDegLat]);
  }
  return pts;
}
function render(f) {
  frame = f;
  document.getElementById("clock").textContent = f.clock;
  if (!online) return drawCanvas(f);
  if (first && f.entities.length) { first = false; const e = f.entities[0]; map.jumpTo({ center: [e.lon, e.lat], zoom: 12 }); }
  spectrum(f);
  const o = overlays(f);
  overlay.setProps({ layers: [
    new deck.PolygonLayer({ id: "sensors", data: o.sensors, getPolygon: (s) => s.poly, filled: true, stroked: true, getFillColor: (s) => [...SIDE[s.side], 14], getLineColor: (s) => [...SIDE[s.side], 90], lineWidthMinPixels: 1 }),
    new deck.ScatterplotLayer({ id: "jammers", data: o.jammers, getPosition: (j) => [j.lon, j.lat], getRadius: (j) => j.radius_m, radiusUnits: "meters", filled: true, stroked: true, getFillColor: (j) => [...SIDE[j.side], 25], getLineColor: (j) => [...SIDE[j.side], 140], lineWidthMinPixels: 1 }),
    new deck.LineLayer({ id: "nets", data: o.links, getSourcePosition: (l) => [l.a.lon, l.a.lat], getTargetPosition: (l) => [l.b.lon, l.b.lat], getColor: (l) => (l.up ? [...SIDE[l.side], 160] : [120, 120, 110, 120]), getWidth: (l) => 1 + Math.min(4, l.traffic), widthUnits: "pixels" }),
    new deck.LineLayer({ id: "chain-cue", data: o.chains.filter((c) => c.s), getSourcePosition: (c) => [c.s.lon, c.s.lat], getTargetPosition: (c) => [c.from.lon, c.from.lat], getColor: (c) => [...SIDE[c.side], 110], getWidth: 1, widthUnits: "pixels" }),
    new deck.LineLayer({ id: "chain-fire", data: o.chains, pickable: true, getSourcePosition: (c) => [c.from.lon, c.from.lat], getTargetPosition: (c) => [c.aim_lon, c.aim_lat], getColor: (c) => [...SIDE[c.side], 220], getWidth: 3, widthUnits: "pixels" }),
    new deck.ScatterplotLayer({ id: "chain-aim", data: o.chains, getPosition: (c) => [c.aim_lon, c.aim_lat], getRadius: 7, radiusUnits: "pixels", filled: false, stroked: true, getLineColor: (c) => [...SIDE[c.side], 230], lineWidthMinPixels: 2 }),
    new deck.ScatterplotLayer({ id: "emitters", data: o.emitters, getPosition: (x) => [x.lon, x.lat], getRadius: 11, radiusUnits: "pixels", filled: false, stroked: true, getLineColor: (x) => [...SIDE[x.side], 200], lineWidthMinPixels: 2 }),
    new deck.ScatterplotLayer({ id: "objective", data: objective ? [objective] : [], getPosition: (o) => [o.lon, o.lat], getRadius: 9, radiusUnits: "pixels", filled: false, stroked: true, getLineColor: [200, 150, 0, 230], lineWidthMinPixels: 3 }),
    new deck.PolygonLayer({ id: "tracks", data: f.tracks, getPolygon: ellipse, filled: true, stroked: true, getFillColor: (t) => [...SIDE[t.owner === "blue" ? "red" : "blue"], 30], getLineColor: (t) => [...SIDE[t.owner === "blue" ? "red" : "blue"], 160], lineWidthMinPixels: 1 }),
    new deck.ScatterplotLayer({ id: "entities", data: f.entities, pickable: true, getPosition: (e) => [e.lon, e.lat], getRadius: 6, radiusUnits: "pixels",
      getFillColor: (e) => e.status === "destroyed" ? [90, 90, 90, 120] : [...SIDE[e.side], e.status === "ok" ? 230 : 140],
      getLineColor: [255, 255, 255], lineWidthMinPixels: 1, stroked: true,
      onClick: (info) => inspect(info.object) }),
    new deck.TextLayer({ id: "labels", data: f.entities, getPosition: (e) => [e.lon, e.lat], getText: (e) => e.name, getSize: 11, getPixelOffset: [0, -14], getColor: (e) => [...SIDE[e.side], 255], fontFamily: "system-ui" }),
  ] });
}
let bounds = null, project = null;
function drawCanvas(f) {
  const c = document.getElementById("canvas"), dpr = window.devicePixelRatio || 1;
  c.width = c.clientWidth * dpr; c.height = c.clientHeight * dpr;
  const g = c.getContext("2d"); g.scale(dpr, dpr);
  const W = c.clientWidth, H = c.clientHeight;
  g.fillStyle = getComputedStyle(document.body).backgroundColor; g.fillRect(0, 0, W, H);
  if (!bounds && f.entities.length) {
    const lats = f.entities.map((e) => e.lat), lons = f.entities.map((e) => e.lon);
    const pad = 0.15;
    bounds = { s: Math.min(...lats), n: Math.max(...lats), w: Math.min(...lons), e: Math.max(...lons) };
    const dl = (bounds.n - bounds.s) * pad + 0.005, dw = (bounds.e - bounds.w) * pad + 0.005;
    bounds.s -= dl; bounds.n += dl; bounds.w -= dw; bounds.e += dw;
  }
  if (!bounds) return;
  // Local equirectangular projection, metres, fitted to the window.
  const c0 = Math.cos(((bounds.s + bounds.n) / 2) * Math.PI / 180);
  const mx = (lon) => (lon - bounds.w) * 111320 * c0, my = (lat) => (lat - bounds.s) * 111320;
  const k = Math.min(W / mx(bounds.e), H / my(bounds.n));
  // Centred in the window.
  const ox = (W - mx(bounds.e) * k) / 2, oy = (H - my(bounds.n) * k) / 2;
  const x = (lon) => ox + mx(lon) * k, y = (lat) => H - oy - my(lat) * k;
  project = { x, y, lon: (px) => bounds.w + (px - ox) / k / (111320 * c0), lat: (py) => bounds.s + (H - oy - py) / k / 111320 };
  spectrum(f);
  const o = overlays(f);
  const rgba = (side, a) => `rgba(${SIDE[side].join(",")},${a})`;
  const mPerPx = 1 / k;
  for (const s of o.sensors) {
    g.strokeStyle = rgba(s.side, 0.35); g.fillStyle = rgba(s.side, 0.05);
    g.beginPath(); s.poly.forEach(([lo, la], i) => (i ? g.lineTo(x(lo), y(la)) : g.moveTo(x(lo), y(la)))); g.closePath(); g.fill(); g.stroke();
  }
  for (const j of o.jammers) {
    g.strokeStyle = rgba(j.side, 0.6); g.fillStyle = rgba(j.side, 0.1);
    g.beginPath(); g.arc(x(j.lon), y(j.lat), j.radius_m / mPerPx, 0, 2 * Math.PI); g.fill(); g.stroke();
  }
  for (const l of o.links) {
    g.strokeStyle = l.up ? rgba(l.side, 0.6) : "rgba(120,120,110,0.5)"; g.lineWidth = 1 + Math.min(4, l.traffic);
    g.beginPath(); g.moveTo(x(l.a.lon), y(l.a.lat)); g.lineTo(x(l.b.lon), y(l.b.lat)); g.stroke();
  }
  g.lineWidth = 2;
  for (const c of o.chains) {
    if (c.s) { g.strokeStyle = rgba(c.side, 0.45); g.lineWidth = 1; g.beginPath(); g.moveTo(x(c.s.lon), y(c.s.lat)); g.lineTo(x(c.from.lon), y(c.from.lat)); g.stroke(); }
    g.strokeStyle = rgba(c.side, 0.9); g.lineWidth = 3; g.beginPath(); g.moveTo(x(c.from.lon), y(c.from.lat)); g.lineTo(x(c.aim_lon), y(c.aim_lat)); g.stroke();
    g.lineWidth = 2; g.beginPath(); g.arc(x(c.aim_lon), y(c.aim_lat), 7, 0, 2 * Math.PI); g.stroke();
  }
  g.lineWidth = 2;
  for (const e of o.emitters) { g.strokeStyle = rgba(e.side, 0.8); g.beginPath(); g.arc(x(e.lon), y(e.lat), 11, 0, 2 * Math.PI); g.stroke(); }
  g.lineWidth = 1;
  if (objective) { g.strokeStyle = "rgba(200,150,0,0.9)"; g.lineWidth = 2; const ox = x(objective.lon), oy = y(objective.lat); g.beginPath(); g.moveTo(ox - 9, oy - 9); g.lineTo(ox + 9, oy + 9); g.moveTo(ox + 9, oy - 9); g.lineTo(ox - 9, oy + 9); g.stroke(); g.lineWidth = 1; }
  for (const t of f.tracks) {
    g.strokeStyle = `rgba(${SIDE[t.owner === "blue" ? "red" : "blue"].join(",")},0.6)`;
    g.beginPath(); ellipse(t).forEach(([lo, la], i) => (i ? g.lineTo(x(lo), y(la)) : g.moveTo(x(lo), y(la)))); g.stroke();
  }
  g.font = "11px system-ui";
  for (const e of f.entities) {
    const [r, gg, b] = SIDE[e.side];
    g.fillStyle = e.status === "destroyed" ? "rgba(90,90,90,0.6)" : `rgba(${r},${gg},${b},${e.status === "ok" ? 0.95 : 0.55})`;
    g.beginPath(); g.arc(x(e.lon), y(e.lat), 6, 0, 2 * Math.PI); g.fill();
    g.fillText(e.name, x(e.lon) + 8, y(e.lat) - 6);
  }
}
document.getElementById("canvas").onclick = (ev) => {
  if (!frame || !project) return;
  if (picking) return setObjective(project.lon(ev.offsetX), project.lat(ev.offsetY));
  const d = (e) => Math.hypot(project.x(e.lon) - ev.offsetX, project.y(e.lat) - ev.offsetY);
  const near = [...frame.entities].sort((a, b) => d(a) - d(b))[0];
  inspect(near && d(near) < 20 ? near : null);
};
function feed(events) {
  const el = document.getElementById("feed");
  for (const ev of events) { const d = document.createElement("div"); d.innerHTML = `<span class="t">${ev.clock}</span>${escapeHtml(ev.text || ev.kind)}`; el.prepend(d); }
  while (el.childNodes.length > 200) el.removeChild(el.lastChild);
}
function questions(qs) {
  const el = document.getElementById("questions");
  el.style.display = qs.length ? "block" : "none";
  el.innerHTML = "";
  for (const q of qs) {
    const d = document.createElement("div");
    d.innerHTML = `<b>${escapeHtml(q.agent)}</b>: ${escapeHtml(q.title)}<div class="muted">${escapeHtml(q.question)}</div>`;
    for (const o of q.options) { const b = document.createElement("button"); b.textContent = o.summary || o.id; b.onclick = () => send({ kind: "answer", question: q.id, choice: o.id }); d.appendChild(b); }
    el.appendChild(d);
  }
}
function inspect(e) {
  const el = document.getElementById("inspect");
  if (!e) { el.style.display = "none"; return; }
  el.style.display = "block";
  el.textContent = JSON.stringify(e, null, 2);
  if (e.domain !== "drone" && document.getElementById("viewer").value === "umpire" && frame) {
    // The detection inspector: can this unit see one of the other side's?
    const others = frame.entities.filter((x) => x.side !== e.side && x.domain !== "drone" && x.status !== "destroyed");
    if (others.length) {
      const row = document.createElement("div");
      const sel = document.createElement("select");
      sel.innerHTML = others.map((x) => `<option value="${escapeHtml(x.name)}">${escapeHtml(x.label || x.name)}</option>`).join("");
      const go = document.createElement("button");
      go.textContent = "Can it see?";
      go.onclick = () => send({ kind: "detect", observer: e.name, target: sel.value });
      row.append(sel, " ", go);
      el.prepend(row);
    }
  }
  if (e.domain !== "drone") {
    const m = document.createElement("button");
    m.textContent = "Messages";
    m.title = "Its latest messages and why each was slow or lost";
    m.onclick = () => send({ kind: "messages", unit: e.name });
    el.prepend(m, " ");
    const b = document.createElement("button");
    b.textContent = "Why?";
    b.title = "What happened to this unit, with the figures behind it";
    b.onclick = () => send({ kind: "why", unit: e.label || e.name });
    el.prepend(b, document.createElement("br"));
  }
}
function escapeHtml(s) { return String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]); }
</script>
