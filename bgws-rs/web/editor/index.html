<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scenario editor</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/map.css">
<script src="/map.js"></script>
<style>
  /* The scenario editor (RUST_ENGINE.md §16): start from a shipped scenario,
     set the theatre, time, weather and duration, place forces from the
     catalogue, check it and save it, or load it into the running game.
     Served by bgws-server at /editor. */
  :root {
    color-scheme: light;
    --page: #f9f9f7; --surface: #fcfcfb; --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
    --line: #e1e0d9; --border: rgba(11, 11, 11, 0.12); --blue: #2f6fd6; --red: #c8402f; --neutral: #78786e; --bad: #d03b3b; --good: #0ca30c;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) { color-scheme: dark; --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink-2: #c3c2b7; --line: #2c2c2a; --border: rgba(255, 255, 255, 0.12); }
  }
  :root[data-theme="dark"] { color-scheme: dark; --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink-2: #c3c2b7; --line: #2c2c2a; --border: rgba(255, 255, 255, 0.12); }
  html, body { margin: 0; background: var(--page); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  .app { display: grid; grid-template-columns: minmax(320px, 440px) 1fr; height: 100vh; }
  @media (max-width: 860px) { .app { grid-template-columns: 1fr; height: auto; } #map { height: 60vh; } }
  aside { overflow: auto; padding: 14px; border-right: 1px solid var(--line); background: var(--surface); }
  h1 { font-size: 18px; margin: 0 0 10px; }
  h2 { font-size: 14px; margin: 16px 0 6px; color: var(--ink-2); }
  label { display: grid; grid-template-columns: 110px 1fr; gap: 8px; align-items: center; margin: 4px 0; font-size: 13px; color: var(--ink-2); }
  input, select, button { font: inherit; font-size: 13px; padding: 4px 6px; border-radius: 6px; border: 1px solid var(--border); background: var(--page); color: var(--ink); min-width: 0; }
  button { cursor: pointer; background: var(--surface); }
  .row { display: flex; gap: 6px; flex-wrap: wrap; margin: 6px 0; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  td, th { padding: 3px 4px 3px 0; border-bottom: 1px solid var(--line); text-align: left; }
  td input, td select { width: 100%; box-sizing: border-box; }
  tr.sel td { background: var(--line); }
  #status { font-size: 13px; white-space: pre-wrap; margin-top: 8px; }
  #status.bad { color: var(--bad); } #status.good { color: var(--good); }
  #map { position: relative; min-height: 300px; }
  #mapgl { position: absolute; inset: 0; }
  #mapgl .maplibregl-canvas { cursor: crosshair; }
  #labels { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .force { display: flex; align-items: center; gap: 4px; cursor: grab; font: 600 12px system-ui, sans-serif; color: #f0efec; text-shadow: 0 0 3px #000, 0 0 2px #000; white-space: nowrap; }
  .force i { width: 12px; height: 12px; border-radius: 50%; border: 2px solid rgba(0,0,0,0.6); box-sizing: border-box; }
  .force.sel i { width: 16px; height: 16px; border: 2px solid #fff; }
  #hint { position: absolute; left: 12px; top: 12px; z-index: 2; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px; font-size: 13px; color: var(--ink-2); }
</style>
</head>
<body>
<div class="app">
  <aside>
    <h1>Scenario editor</h1>
    <label>Start from <select id="preset"></select></label>
    <label>Name <input id="name"></label>
    <label>Duration (min) <input id="duration" type="number" min="5" step="5"></label>
    <label>Start (UTC) <input id="start" type="datetime-local"></label>
    <label>Weather <select id="weather"></select></label>
    <label>Ground <select id="ground"><option value="generated">generated</option><option value="raster+relief">raster + relief</option><option value="raster">raster</option></select></label>
    <label>Theatre pack <input id="pack" list="pack-list" placeholder="none (folder under packs/)"></label>
    <datalist id="pack-list"></datalist>
    <button id="pack-centre" title="Centre the forces on the pack, moving everything in the scenario with them">Move onto the pack</button>
    <label title="The pack's elevation as 3D terrain (×1.5) and buildings as blocks: right-drag or Ctrl-drag to tilt and turn">3D terrain <input id="threed" type="checkbox" style="justify-self:start"></label>
    <label>Origin <span style="display:grid;grid-template-columns:1fr 1fr;gap:6px"><input id="lat" type="number" step="0.001" aria-label="Origin latitude"><input id="lon" type="number" step="0.001" aria-label="Origin longitude"></span></label>
    <h2>Forces</h2>
    <div class="row"><button id="add">Add a force</button><span class="muted" style="color:var(--muted);font-size:12px">Select a row, then click the map to place it.</span></div>
    <datalist id="platforms"></datalist>
    <table><thead><tr><th>Id</th><th>Side</th><th>Platform</th><th>Count</th><th>Quality</th><th>Behaviour</th><th></th></tr></thead><tbody id="forces"></tbody></table>
    <h2>Save</h2>
    <div class="row"><button id="check">Check</button><button id="download">Download JSON</button><button id="load">Load into the game</button></div>
    <div id="status"></div>
  </aside>
  <div id="map"><div id="mapgl"></div><canvas id="labels"></canvas><div id="hint"></div></div>
</div>
<script type="application/json" id="data">__BGWS_DATA__</script>
<script>
const D = JSON.parse(document.getElementById("data").textContent);
const $ = (id) => document.getElementById(id);
const COLOR = { blue: "#2f6fd6", red: "#c8402f", neutral: "#78786e" };
let sc = null, selected = null;
const status = (text, kind) => { $("status").textContent = text; $("status").className = kind || ""; };

for (const p of D.presets) $("preset").add(new Option(p.scenario.name, p.id));
for (const w of D.weather) $("weather").add(new Option(w, w));
$("platforms").innerHTML = D.platforms.map((p) => `<option value="${p.id}">${p.name} (${p.domain}, ${p.role})</option>`).join("");
const platformName = new Map(D.platforms.map((p) => [p.id, p.name]));
// Behaviour templates: the shipped ones and the custom library (made in the Behaviour Manager).
const templateOptions = `<option value="">platform default</option>` + D.templates.map((t) => `<option value="${t.id}">${t.custom ? "★ " : ""}${t.name || t.id}</option>`).join("");
const behaviours = () => (sc.behaviours = sc.behaviours || { assign: {}, templates: [] }, sc.behaviours.assign = sc.behaviours.assign || {}, sc.behaviours);
/** Put the custom templates the forces use, and their custom ancestors, into the scenario. */
function withTemplates() {
  const b = behaviours(), lib = new Map(D.custom.map((t) => [t.id, t]));
  const keep = (b.templates || []).filter((t) => !lib.has(t.id));
  const need = [], todo = Object.values(b.assign).filter((id) => lib.has(id));
  while (todo.length) {
    const id = todo.pop();
    if (need.some((t) => t.id === id) || !lib.has(id)) continue;
    const t = lib.get(id);
    need.push(t);
    if (t.parent) todo.push(t.parent);
  }
  b.templates = [...keep, ...need];
  return sc;
}

function loadPreset(id) {
  sc = JSON.parse(JSON.stringify(D.presets.find((p) => p.id === id).scenario));
  sc.notes = [...(sc.notes || []), `edited from ${id}`];
  delete sc.convertedFrom;
  selected = null;
  fill();
  fit();
}
function fill() {
  $("name").value = sc.name;
  $("duration").value = sc.scope.durationMin;
  $("start").value = (sc.startUtc || "").slice(0, 16);
  $("weather").value = (sc.weather && sc.weather.weather) || "clear";
  $("ground").value = sc.theatre.ground || "generated";
  $("pack").value = sc.theatre.pack || "";
  $("lat").value = sc.theatre.origin.lat; $("lon").value = sc.theatre.origin.lon;
  table(); draw();
}
$("preset").onchange = (e) => loadPreset(e.target.value);
$("name").oninput = (e) => (sc.name = e.target.value);
$("duration").oninput = (e) => (sc.scope.durationMin = Number(e.target.value));
$("start").oninput = (e) => (sc.startUtc = e.target.value ? new Date(e.target.value + "Z").toISOString().replace(".000", "") : sc.startUtc);
$("weather").onchange = (e) => (sc.weather = { source: "preset", weather: e.target.value });
$("ground").onchange = (e) => (sc.theatre.ground = e.target.value);
$("pack").oninput = (e) => { if (e.target.value) sc.theatre.pack = e.target.value; else delete sc.theatre.pack; draw(); };
// Packs built by `bgws terrain` or the viewer's "Generate ground".
$("pack-list").innerHTML = (D.packs || []).map((p) => `<option value="${p.name}"></option>`).join("");
$("pack-centre").onclick = () => {
  const p = (D.packs || []).find((x) => x.name === $("pack").value);
  if (!p || !p.bbox) { status("Pick a pack built by `bgws terrain` (or the viewer's Generate ground) first.", "bad"); return; }
  // Centre the forces on the pack, moving everything else with them.
  const fs = sc.forces.length ? sc.forces : [{ position: sc.theatre.origin }];
  const lats = fs.map((f) => f.position.lat), lons = fs.map((f) => f.position.lon);
  const midLat = (Math.min(...lats) + Math.max(...lats)) / 2, midLon = (Math.min(...lons) + Math.max(...lons)) / 2;
  shiftAll((p.bbox[1] + p.bbox[3]) / 2 - midLat, (p.bbox[0] + p.bbox[2]) / 2 - midLon);
  delete sc.theatre.bounds;
  const [w, so, e, n] = p.bbox;
  const out = sc.forces.filter((f) => f.position.lat < so || f.position.lat > n || f.position.lon < w || f.position.lon > e).length;
  if (out) status(`${out} of the forces fall outside pack ${p.name}: build a bigger box.`, "bad");
  fill();
  fit();
};
// Every position in the scenario (origin, forces, tasks, lanes, obstacles,
// measures, areas, victory conditions) moves by the same amount.
function shiftAll(dLat, dLon) {
  const walk = (v) => {
    if (Array.isArray(v)) { v.forEach(walk); return; }
    if (!v || typeof v !== "object") return;
    if (typeof v.lat === "number" && typeof v.lon === "number") { v.lat += dLat; v.lon += dLon; }
    Object.values(v).forEach(walk);
  };
  walk(sc);
  if (sc.theatre.bounds) { const b = sc.theatre.bounds; b.south += dLat; b.north += dLat; b.west += dLon; b.east += dLon; }
}
// Moving the origin moves the theatre and everything in it.
function moveOrigin() {
  const lat = Number($("lat").value), lon = Number($("lon").value);
  if (!isFinite(lat) || !isFinite(lon)) return;
  shiftAll(lat - sc.theatre.origin.lat, lon - sc.theatre.origin.lon);
  draw();
  fit();
}
$("lat").onchange = moveOrigin; $("lon").onchange = moveOrigin;

function table() {
  const tb = $("forces");
  tb.innerHTML = "";
  sc.forces.forEach((f, i) => {
    const tr = document.createElement("tr");
    if (i === selected) tr.className = "sel";
    tr.innerHTML = `<td><input value="${f.id}" data-k="id"></td>
      <td><select data-k="side">${["blue", "red", "neutral"].map((s) => `<option ${f.side === s ? "selected" : ""}>${s}</option>`).join("")}</select></td>
      <td><input list="platforms" value="${f.platform}" data-k="platform" title="${platformName.get(f.platform) || "unknown platform"}"></td>
      <td><input type="number" min="1" value="${f.count}" data-k="count" style="width:4em"></td>
      <td><select data-k="quality">${["conscript", "regular", "veteran", "elite"].map((q) => `<option ${(f.quality || "regular") === q ? "selected" : ""}>${q}</option>`).join("")}</select></td>
      <td><select data-b aria-label="Behaviour template">${templateOptions}</select></td>
      <td><button title="Remove">✕</button></td>`;
    tr.onclick = (ev) => { if (ev.target.tagName === "BUTTON") return; selected = i; for (const r of tb.children) r.className = ""; tr.className = "sel"; hint(); draw(); };
    const bsel = tr.querySelector("[data-b]");
    bsel.value = behaviours().assign[f.id] || "";
    bsel.onchange = () => { if (bsel.value) behaviours().assign[f.id] = bsel.value; else delete behaviours().assign[f.id]; };
    for (const inp of tr.querySelectorAll("[data-k]")) inp.onchange = (ev) => {
      const k = ev.target.dataset.k;
      if (k === "id" && behaviours().assign[f.id]) { behaviours().assign[ev.target.value] = behaviours().assign[f.id]; delete behaviours().assign[f.id]; }
      f[k] = k === "count" ? Math.max(1, Number(ev.target.value)) : ev.target.value;
      if (k === "id") f.label = f.label && f.label !== f.id ? f.label : ev.target.value;
      draw();
    };
    tr.querySelector("button").onclick = () => { delete behaviours().assign[f.id]; sc.forces.splice(i, 1); selected = null; table(); draw(); };
    tb.appendChild(tr);
  });
  hint();
}
$("add").onclick = () => {
  let n = sc.forces.length + 1, id;
  do { id = `new-${n++}`; } while (sc.forces.some((f) => f.id === id));
  sc.forces.push({ id, label: id, side: "blue", platform: "generic/mbt", count: 1, quality: "regular", position: { lat: sc.theatre.origin.lat, lon: sc.theatre.origin.lon, h: 0 }, layer: "unit" });
  selected = sc.forces.length - 1;
  table(); draw();
};
function hint() { $("hint").textContent = selected != null && sc.forces[selected] ? `Click the map to place ${sc.forces[selected].id}` : "Select a force to place it"; }

// The map: MapLibre over the world overview (the Protomaps planet's low
// zooms, proxied and cached by bgws-server), the scenario's pack in full
// detail over its box, every pack's outline, and the forces as markers to
// drag or place.
const { maplibregl, terrainLayers, worldLayers } = window.BgwsMap;
const abs = (u) => `pmtiles://${location.origin}${u}`;
const map = new maplibregl.Map({
  container: "mapgl",
  style: {
    version: 8,
    sources: { world: { type: "vector", url: abs("/world.pmtiles"), attribution: "© OpenStreetMap contributors · Protomaps" } },
    layers: [{ id: "bg", type: "background", paint: { "background-color": "#0b1220" } }, ...worldLayers("world")],
  },
  center: [20, 54], zoom: 5, attributionControl: { compact: true },
});
map.addControl(new maplibregl.NavigationControl({ showCompass: false }), "top-right");
map.addControl(new maplibregl.ScaleControl({ unit: "metric" }), "bottom-left");
let mapReady = false, worldFailed = false;
map.on("error", (e) => {
  if (!worldFailed && String(e.error && e.error.message).includes("world")) { worldFailed = true; status("The world map is not available (offline, and not cached yet): packs still show.", "bad"); }
});
const boxRing = ([w, s, e, n]) => [[w, s], [e, s], [e, n], [w, n], [w, s]];
map.on("load", () => {
  mapReady = true;
  // Every pack's box, dashed; the scenario's own, bright.
  map.addSource("packs", { type: "geojson", data: { type: "FeatureCollection", features: [] } });
  map.addLayer({ id: "packs-line", type: "line", source: "packs", paint: { "line-color": ["case", ["get", "current"], "#f2c14e", "#8a93b5"], "line-width": ["case", ["get", "current"], 2, 1], "line-dasharray": [3, 2] } });
  map.addSource("theatre", { type: "geojson", data: { type: "FeatureCollection", features: [] } });
  map.addLayer({ id: "theatre-line", type: "line", source: "theatre", paint: { "line-color": "#c3c2b7", "line-width": 1 } });
  draw(); fit();
});

// The scenario's pack in full detail, under the outlines.
let shownPack = null;
function showPack() {
  const name = sc.theatre.pack || null;
  const key = `${name}|${$("threed").checked}`;
  if (!mapReady || key === shownPack) return;
  if (map.getTerrain()) map.setTerrain(null);
  for (const l of map.getStyle().layers) if (l.id.startsWith("pack-") && l.id !== "pack-line") map.removeLayer(l.id);
  for (const id of ["pack", "pack-dem", "pack-terrain"]) if (map.getSource(id)) map.removeSource(id);
  shownPack = key;
  const p = (D.packs || []).find((x) => x.name === name);
  $("threed").disabled = !(p && p.dem);
  $("threed").parentElement.title = p && p.dem ? "The pack's elevation as 3D terrain (×1.5) and buildings as blocks: right-drag or Ctrl-drag to tilt and turn" : "3D needs a pack with an elevation map: pick one, or build it again with bgws terrain";
  if (!p || !p.basemap) return;
  const solid = $("threed").checked && !!p.dem;
  map.addSource("pack", { type: "vector", url: abs(p.basemap), attribution: "© OpenStreetMap contributors · Protomaps" });
  if (p.dem) map.addSource("pack-dem", { type: "raster-dem", url: abs(p.dem), encoding: "terrarium", tileSize: 512 });
  for (const l of terrainLayers("pack", "pack-dem", "pack", solid)) if (l.id !== "pack-hillshade" || p.dem) map.addLayer(l, "packs-line");
  if (solid) {
    map.addSource("pack-terrain", { type: "raster-dem", url: abs(p.dem), encoding: "terrarium", tileSize: 512 });
    map.setTerrain({ source: "pack-terrain", exaggeration: 1.5 });
    if (map.getPitch() < 30) map.easeTo({ pitch: 55, duration: 800 });
  } else if (map.getPitch() > 0) map.easeTo({ pitch: 0, bearing: 0, duration: 600 });
}
$("threed").onchange = () => showPack();

// Place names, drawn on a canvas over the map (no glyph server needed).
const LABEL_KINDS = { country: 0, region: 1, locality: 2 };
function labels() {
  const c = $("labels"), dpr = devicePixelRatio || 1, W = c.clientWidth, H = c.clientHeight;
  c.width = W * dpr; c.height = H * dpr;
  const g = c.getContext("2d"); g.scale(dpr, dpr);
  if (!mapReady) return;
  const z = map.getZoom();
  const feats = [];
  for (const src of ["world", "pack"]) {
    if (!map.getSource(src)) continue;
    for (const f of map.querySourceFeatures(src, { sourceLayer: "places" })) {
      const k = LABEL_KINDS[f.properties.kind], name = f.properties.name;
      if (k == null || !name || f.geometry.type !== "Point") continue;
      if ((f.properties.min_zoom ?? 0) > z + 0.5) continue;
      if (k === 0 && z > 7) continue;
      if (k === 1 && (z < 4 || z > 8)) continue;
      feats.push({ k, name, at: f.geometry.coordinates, rank: f.properties.population_rank ?? 0 });
    }
  }
  feats.sort((a, b) => a.k - b.k || b.rank - a.rank);
  const taken = [], seen = new Set();
  for (const f of feats) {
    if (seen.has(f.name)) continue;
    const p = map.project(f.at);
    const size = f.k === 0 ? 14 : f.k === 1 ? 11 : f.rank >= 10 ? 13 : 11;
    g.font = `${f.k === 2 ? 600 : 500} ${size}px system-ui, sans-serif`;
    const w = g.measureText(f.name).width, box = [p.x - w / 2 - 3, p.y - size, p.x + w / 2 + 3, p.y + 4];
    if (box[2] < 0 || box[0] > W || box[3] < 0 || box[1] > H || taken.some((t) => box[0] < t[2] && box[2] > t[0] && box[1] < t[3] && box[3] > t[1])) continue;
    taken.push(box); seen.add(f.name);
    g.lineWidth = 3; g.strokeStyle = "rgba(5,8,15,0.9)"; g.fillStyle = f.k === 0 ? "#c9cfe6" : f.k === 1 ? "#9aa3c2" : "#eceef6";
    g.textAlign = "center";
    if (f.k === 2) { g.beginPath(); g.arc(p.x, p.y + 6, 2, 0, 2 * Math.PI); g.fill(); }
    g.strokeText(f.name, p.x, p.y); g.fillText(f.name, p.x, p.y);
  }
}
let labelQueued = false;
const queueLabels = () => { if (!labelQueued) { labelQueued = true; requestAnimationFrame(() => { labelQueued = false; labels(); }); } };
map.on("move", queueLabels); map.on("idle", queueLabels); map.on("sourcedata", queueLabels);

// The forces, as markers: click one to select it, drag it to move it.
let markers = [];
function draw() {
  if (!sc) return;
  for (const m of markers) m.remove();
  markers = sc.forces.map((f, i) => {
    const el = document.createElement("div");
    el.className = "force" + (i === selected ? " sel" : "");
    el.innerHTML = `<i style="background:${COLOR[f.side] || COLOR.neutral}"></i><span></span>`;
    el.querySelector("span").textContent = `${f.id}${f.count > 1 ? " ×" + f.count : ""}`;
    el.addEventListener("click", (ev) => { ev.stopPropagation(); selected = i; table(); draw(); });
    const m = new maplibregl.Marker({ element: el, draggable: true, anchor: "left", offset: [-8, 0] }).setLngLat([f.position.lon, f.position.lat]).addTo(map);
    m.on("dragend", () => { const p = m.getLngLat(); f.position = { ...f.position, lat: p.lat, lon: p.lng }; selected = i; table(); draw(); });
    return m;
  });
  if (!mapReady) return;
  showPack();
  map.getSource("packs").setData({ type: "FeatureCollection", features: (D.packs || []).filter((p) => p.bbox).map((p) => ({ type: "Feature", properties: { current: p.name === sc.theatre.pack }, geometry: { type: "LineString", coordinates: boxRing(p.bbox) } })) });
  const b = sc.theatre.bounds;
  map.getSource("theatre").setData({ type: "FeatureCollection", features: b ? [{ type: "Feature", properties: {}, geometry: { type: "LineString", coordinates: boxRing([b.west, b.south, b.east, b.north]) } }] : [] });
}
// Look at the forces (and the pack's box, if it has one).
function fit() {
  if (!mapReady || !sc) return;
  const pts = sc.forces.map((f) => [f.position.lon, f.position.lat]);
  if (!pts.length) pts.push([sc.theatre.origin.lon, sc.theatre.origin.lat]);
  const lons = pts.map((p) => p[0]), lats = pts.map((p) => p[1]);
  const pad = 0.02;
  map.fitBounds([[Math.min(...lons) - pad, Math.min(...lats) - pad], [Math.max(...lons) + pad, Math.max(...lats) + pad]], { padding: 60, maxZoom: 13, duration: 0 });
}
map.on("click", (ev) => {
  if (selected == null || !sc.forces[selected]) return;
  const f = sc.forces[selected];
  f.position = { ...f.position, lat: ev.lngLat.lat, lon: ev.lngLat.lng };
  draw();
});

// The server checks it and can load it into the running game.
let ws = null;
function connect() {
  if (ws && ws.readyState <= 1) return ws;
  ws = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ws");
  ws.binaryType = "arraybuffer";
  ws.onmessage = (m) => {
    // The game's binary position updates are for the viewer.
    if (typeof m.data !== "string") return;
    const msg = JSON.parse(m.data);
    if (msg.kind === "checked") status(msg.errors.length ? "Problems:\n- " + msg.errors.join("\n- ") : (msg.loaded ? "Loaded into the game: open the viewer and press Play." : "No problems found."), msg.errors.length ? "bad" : "good");
  };
  return ws;
}
function sendWhenOpen(o) { const w = connect(); if (w.readyState === 1) w.send(JSON.stringify(o)); else w.addEventListener("open", () => w.send(JSON.stringify(o)), { once: true }); }
$("check").onclick = () => { status("checking…"); sendWhenOpen({ kind: "check", scenario: withTemplates() }); };
$("load").onclick = () => { if (confirm("Replace the running game with this scenario?")) { status("loading…"); sendWhenOpen({ kind: "load", scenario: withTemplates() }); } };
$("download").onclick = () => {
  withTemplates();
  sc.savedAt = new Date().toISOString();
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([JSON.stringify(sc, null, 2)], { type: "application/json" }));
  a.download = (sc.name || "scenario").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") + ".json";
  a.click();
};
loadPreset(D.presets[0].id);
</script>
</body>
